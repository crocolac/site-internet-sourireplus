name: Publish signed bridge updates to OVH

on:
  push:
    branches: [main]
    paths:
      - "bridge-releases/**"
      - "scripts/publish_bridge_updates.py"
      - "tests/test_bridge_publisher.py"
      - ".github/workflows/publish-bridge-updates.yml"
  pull_request:
    paths:
      - "bridge-releases/**"
      - "scripts/publish_bridge_updates.py"
      - "tests/test_bridge_publisher.py"
      - ".github/workflows/publish-bridge-updates.yml"

permissions:
  contents: read

concurrency:
  group: bridge-update-publication-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography==50.0.2
      - name: Check publication safeguards
        run: python -m unittest discover -s tests -p test_bridge_publisher.py -v
      - name: Validate the signed executable and manifest
        run: python scripts/publish_bridge_updates.py

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography==50.0.2 paramiko==5.0.0
      - name: Publish executable first and signed manifest last, then verify HTTPS
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: python scripts/publish_bridge_updates.py --publish
