name: Method two-screen application and Windows kit

on:
  pull_request:
    paths: ['methode-release/**', 'public/methode/visite/**', 'public/methode/api/**', 'scripts/publish_methode.py', 'tests/test_methode_publisher.py', '.github/workflows/publish-methode.yml']
  push:
    branches: [main]
    paths: ['methode-release/release.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: methode-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  hosted-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install cryptography==50.0.2 paramiko==4.0.0
      - run: python -m unittest discover -s tests -p test_methode_publisher.py -v
      - name: Extract the versioned source snapshot
        run: |
          python - <<'PY'
          import base64,io,zipfile,json,sys
          from pathlib import Path
          zipfile.ZipFile(io.BytesIO(base64.b64decode(Path('methode-release/source.zip.b64').read_bytes()))).extractall('method-source')
          sys.path.insert(0,'scripts')
          from publish_methode import validate_web_snapshot
          validate_web_snapshot(Path('public/methode'),Path('method-source/web'),json.loads(Path('methode-release/release.json').read_text()))
          PY
      - name: Private sessions, persistence and authorization
        working-directory: method-source
        run: python web/tests/test_hosted.py -v
      - name: Versioned OAuth and Unite bridge checks
        working-directory: method-source
        run: |
          python - <<'PYTEST'
          import json,subprocess,sys
          from pathlib import Path
          version=tuple(map(int,json.loads(Path('../methode-release/release.json').read_text()).get('web_version','0.4.0').split('.')))
          if version >= (0,5,0):subprocess.run([sys.executable,'web/tests/test_3shape.py','-v'],check=True)
          if version >= (0,6,0):
              subprocess.run([sys.executable,'-m','pip','install','-r','bridge/requirements-test.txt'],check=True)
              subprocess.run([sys.executable,'web/tests/test_3shape_flow.py','-v'],check=True)
          PYTEST
      - name: Install browser verification
        working-directory: method-source
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Complete two-screen journey
        working-directory: method-source
        run: node web/tests/test_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methode-web-verification
          path: method-source/web/test-output/
          retention-days: 14

  windows-kit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract bridge source
        shell: python
        run: |
          import base64,io,zipfile
          from pathlib import Path
          zipfile.ZipFile(io.BytesIO(base64.b64decode(Path('methode-release/source.zip.b64').read_bytes()))).extractall('method-source')
      - run: python -m pip install -r method-source/bridge/requirements-build.txt
      - name: Protocol, privacy and web launch checks
        working-directory: method-source
        env:
          PYTHONPATH: bridge/src
        run: python -m unittest discover -s bridge/tests -v
      - name: Build and verify the Windows executables
        shell: pwsh
        run: ./method-source/bridge/scripts/build-windows.ps1
      - name: Verify Windows PowerShell 5.1 installation
        shell: powershell
        run: |
          & './method-source/bridge/dist/kit/scripts/Install-Bridge.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed.' }
          $Launcher = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'SourirePlus\Bridge\SourirePlusLauncher.exe'
          & $Launcher --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed launcher failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: methode-windows-kit
          path: method-source/bridge/dist/kit/
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.event_name == 'push'
    needs: [hosted-tests, windows-kit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the exact approved Windows build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          r=json.loads(Path('methode-release/release.json').read_text())
          run=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{r['build_run_id']}"],text=True))
          assert run['conclusion']=='success' and run['head_sha']==r['build_head_sha'] and run['path']=='.github/workflows/publish-methode.yml'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"run_id={r['build_run_id']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: methode-windows-kit
          path: approved-kit
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install cryptography==50.0.2 paramiko==4.0.0
      - run: python scripts/publish_methode.py --kit approved-kit
      - name: Publish only Method files and signed receiver
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: python scripts/publish_methode.py --kit approved-kit --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methode-encrypted-installation
          path: delivery-encrypted/*
          retention-days: 7
          if-no-files-found: warn

