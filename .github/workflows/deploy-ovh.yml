name: Deploy static site to OVH

on:
  push:
    branches: [main]
    paths:
      - ".deploy-ovh"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to publish the static build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify exported routes
        run: |
          test -f out/index.html
          test -f out/methode/index.html
      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Publish without deleting the legacy backup
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_SERVER" <<'LFTP'
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          mirror --reverse --verbose --parallel=4 --only-newer out/ ./
          bye
          LFTP
