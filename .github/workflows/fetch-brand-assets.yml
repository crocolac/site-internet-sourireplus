name: Fetch legacy SourirePlus brand assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-brand-assets.yml"

permissions:
  contents: read

jobs:
  fetch-brand-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Download explicitly allow-listed public brand files
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail
          mkdir -p legacy-brand legacy-human
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_SERVER" <<'LFTP'
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          get "sourireplus.bak/wp-content/themes/sourireplus/img/logo.png" -o "legacy-brand/logo.png"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/logo-small.png" -o "legacy-brand/logo-small.png"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/logo-footer.png" -o "legacy-brand/logo-footer.png"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/favicon.png" -o "legacy-brand/favicon.png"
          get "sourireplus.bak/wp-content/themes/sourireplus/style.css" -o "legacy-brand/legacy-style.css"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/photo-01.jpg" -o "legacy-human/photo-01.jpg"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/photo-02.jpg" -o "legacy-human/photo-02.jpg"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/photo-03.jpg" -o "legacy-human/photo-03.jpg"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/photo-04.jpg" -o "legacy-human/photo-04.jpg"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/raphael-action.jpg" -o "legacy-human/raphael-action.jpg"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/guillaume-action.jpg" -o "legacy-human/guillaume-action.jpg"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/medecin-dentiste-raphael-lacoste.jpg" -o "legacy-human/raphael-portrait-2015.jpg"
          get "sourireplus.bak/wp-content/themes/sourireplus/img/medecin-dentiste-guillaume-guilbert.jpg" -o "legacy-human/guillaume-portrait-2015.jpg"
          get "sourireplus.bak/wp-content/uploads/2015/10/PHOTO-NEWS-SP1.jpg" -o "legacy-human/photo-news-sp1.jpg"
          get "sourireplus.bak/wp-content/uploads/2015/10/RAPHAELOKDEF.jpg" -o "legacy-human/raphael-studio-2015.jpg"
          get "sourireplus.bak/wp-content/uploads/2015/10/GUILLAUMEOKDEF.jpg" -o "legacy-human/guillaume-studio-2015.jpg"
          get "sourireplus.bak/wp-content/uploads/2018/12/raph.png" -o "legacy-human/raphael-clinic-2018.png"
          get "sourireplus.bak/wp-content/uploads/2018/12/raphael.png" -o "legacy-human/raphael-cutout-2018.png"
          get "sourireplus.bak/wp-content/uploads/2018/12/guillaume.png" -o "legacy-human/guillaume-clinic-2018.png"
          get "sourireplus.bak/wp-content/uploads/2018/12/guillaume-1.png" -o "legacy-human/guillaume-cutout-2018.png"
          bye
          LFTP

      - name: Verify allow-list
        run: |
          set -euo pipefail
          test -s legacy-brand/logo.png
          test -s legacy-brand/logo-small.png
          test -s legacy-brand/logo-footer.png
          test -s legacy-brand/favicon.png
          test -s legacy-brand/legacy-style.css
          test -s legacy-human/raphael-portrait-2015.jpg
          test -s legacy-human/guillaume-portrait-2015.jpg
          find legacy-brand legacy-human -maxdepth 1 -type f -printf '%p\n' | sort

      - name: Upload temporary brand artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourireplus-legacy-brand
          path: legacy-brand/
          retention-days: 3
          if-no-files-found: error

      - name: Upload temporary human photos artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourireplus-legacy-human
          path: legacy-human/
          retention-days: 3
          if-no-files-found: error
