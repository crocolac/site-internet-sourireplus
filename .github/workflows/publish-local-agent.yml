name: Local bridge agent update
on:
  pull_request:
    paths: ['agent-release/**', '.github/workflows/publish-local-agent.yml']
  push:
    branches: [main]
    paths: ['agent-release/release.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: local-agent-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and extract approved source
        shell: python
        run: |
          import base64, hashlib, io, json, zipfile
          from pathlib import Path
          meta=json.loads(Path('agent-release/source.json').read_text())
          raw=Path('agent-release/source.zip.b64').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==meta['sha256']
          zipfile.ZipFile(io.BytesIO(base64.b64decode(raw))).extractall('agent-source')
      - run: python -m pip install -r agent-source/bridge/requirements-build.txt
      - name: Windows protocol and TLS tests
        env:
          PYTHONPATH: agent-source/bridge/src
        run: python -m unittest discover -s agent-source/bridge/tests -v
      - name: Build and smoke test Windows executable
        shell: pwsh
        run: ./agent-source/bridge/scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: approved-local-agent
          path: agent-source/bridge/dist/SourirePlusBridge.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact approved build provenance
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          r=json.loads(Path('agent-release/release.json').read_text())
          run=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{r['build_run_id']}"],text=True))
          assert run['conclusion']=='success' and run['head_sha']==r['build_head_sha']
          assert run['path']=='.github/workflows/publish-local-agent.yml'
          source=subprocess.check_output(['gh','api','-H','Accept: application/vnd.github.raw+json',f"repos/{os.environ['GITHUB_REPOSITORY']}/contents/agent-release/source.json?ref={r['build_head_sha']}"])
          assert json.loads(source)==json.loads(Path('agent-release/source.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"run_id={r['build_run_id']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: approved-local-agent
          path: approved-agent
          run-id: ${{ steps.approved.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install cryptography==50.0.2 paramiko==4.0.0
      - name: Assemble exact signed release
        run: |
          python - <<'PY'
          import base64,json,shutil
          from pathlib import Path
          root=Path('agent-staged');root.mkdir()
          manifest=Path('agent-release/manifest.json').read_bytes()
          payload=json.loads(base64.b64decode(json.loads(manifest)['payload']))
          assert payload['version']==json.loads(Path('agent-release/release.json').read_text())['version']
          assert payload['min_launcher']==2
          (root/'manifest.json').write_bytes(manifest)
          shutil.copyfile('bridge-releases/current/public-key.txt',root/'public-key.txt')
          shutil.copyfile('approved-agent/SourirePlusBridge.exe',root/('SourirePlusBridge-'+payload['version']+'.exe'))
          PY
          python scripts/publish_bridge_updates.py --release-dir agent-staged
      - name: Publish signed agent only and verify live HTTPS
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: python scripts/publish_bridge_updates.py --release-dir agent-staged --publish
