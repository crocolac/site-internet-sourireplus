const params=new URLSearchParams(location.hash.slice(1)),token=params.get('token'),sessionId=params.get('session');

const lockIcon='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 14v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

      { id:'caries', points:[[10,35],[15,30],[20,15],[29,11],[39,41],[50,23],[60,26],[66,30],[73,39],[80,76]] },

    ];

const planStages=[['essential','Essentiels'],['needs','Besoins'],['strategy','Stratégie']];

const formatMean=value=>Number(value).toLocaleString('fr-CH',{minimumFractionDigits:1,maximumFractionDigits:1});
function curvePath(points){
  if(points.length<2)return '';
  const slopes=points.slice(1).map((p,i)=>(p[1]-points[i][1])/(p[0]-points[i][0]));
  const tangent=points.map((p,i)=>i===0?slopes[0]:i===points.length-1?slopes.at(-1):slopes[i-1]*slopes[i]<=0?0:2/(1/slopes[i-1]+1/slopes[i]));
  let path='M'+points[0].join(',');
  for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1],dx=(b[0]-a[0])/3;path+=' C'+[a[0]+dx,a[1]+tangent[i]*dx,b[0]-dx,b[1]-tangent[i+1]*dx,...b].join(',')}
  return path;
}
function referenceCurve(c){
  const series=referenceSeries.find(item=>item.id===c.id);if(!series)return '';
  const color=criterionColors[c.id],x=age=>28+(age-10)*164/70,y=value=>108-value*.8;
  const age=state.patient_age,hasAge=Number.isInteger(age)&&age>=10&&age<=80;
  let svg='<svg viewBox="0 0 210 144" role="img" aria-label="'+esc(c.label)+' : repères de population de 10 à 80 ans'+(hasAge?', âge du patient '+age+' ans':'')+'">';
  for(const n of [0,50,100])svg+='<line x1="28" y1="'+y(n)+'" x2="192" y2="'+y(n)+'" stroke="#dce2dc"/><text x="23" y="'+(y(n)+3)+'" text-anchor="end">'+n+'</text>';
  for(const n of [10,30,50,80])svg+='<text x="'+x(n)+'" y="123" text-anchor="middle">'+n+'</text>';
  svg+='<text x="28" y="15">Population (%)</text><text x="192" y="138" text-anchor="end">Âge (ans)</text>';
  svg+='<path d="'+curvePath(series.points.map(([a,v])=>[x(a),y(v)]))+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/>';
  if(hasAge)svg+='<line x1="'+x(age)+'" y1="25" x2="'+x(age)+'" y2="109" stroke="#213942" stroke-width="1.2" stroke-dasharray="3 3"/>';
  svg+='</svg>';
  return '<figure class="reference-curve" data-curve="'+c.id+'" style="--criterion-color:'+color+'">'+svg+'<figcaption>'+(hasAge?'Votre âge : '+age+' ans':Number.isInteger(age)?'Repères disponibles de 10 à 80 ans':'Repères de vie')+'</figcaption></figure>';
}
function inheritedScores(stage){
  const values={...state.scores.clinical};
  for(const [key] of planStages){if(key===stage)break;for(const c of criteria()){const n=planDraft?.objectives?.[key]?.[c.id];if(Number.isInteger(n))values[c.id]=n}}
  return values;
}
function objectiveGrid(stage,title){
  const inherited=inheritedScores(stage);
  let html='<div class="objective-grid" data-objective-grid="'+stage+'"><h4>Objectifs sur 10 <span>facultatifs</span></h4><p class="objective-help">Une ligne vide conserve la note précédente. Touchez à nouveau la note choisie pour l’effacer.</p>';
  for(const c of criteria()){
    const chosen=planDraft?.objectives?.[stage]?.[c.id]??null;
    html+='<div class="objective-row"><div class="objective-label"><strong>'+esc(c.label)+'</strong><span>'+ (chosen===null?'Repris : '+inherited[c.id]:inherited[c.id]+' → '+chosen)+'/10</span></div><div class="objective-options" role="group" aria-label="'+title+' · objectif '+esc(c.label)+'">';
    for(let n=1;n<=10;n++)html+='<button type="button" id="objective-'+stage+'-'+c.id+'-'+n+'" class="objective-button'+(chosen===n?' selected':'')+'" data-action="objective" data-stage="'+stage+'" data-criterion="'+c.id+'" data-score="'+n+'" aria-pressed="'+(chosen===n)+'" aria-label="'+title+' · '+esc(c.label)+' : objectif '+n+' sur 10"'+disabled(false)+'>'+n+'</button>';
    html+='</div></div>';
  }
  return html+'</div>';
}
function evolutionCards(print=false){

  html+='<article class="mean-card mean-patient"><h3>Votre ressenti</h3><strong class="mean-number" data-mean="patient">'+formatMean(e.patient_mean)+'</strong><span>sur 10</span></article>';

async function downloadReport(){if(busy||!online)return;busy=true;connectionStatus();try{const response=await request('/api/report'),blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Rapport_DX_demonstration.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Le rapport fourni a été téléchargé.')}catch(error){toast(error.status?error.message:'Le document n’a pas pu être téléchargé.')}finally{busy=false;connectionStatus()}}
async function prepareSummary(){if(busy||!online||!summaryReady())return;busy=true;summaryApproved=false;mutationEpoch++;render();let ready=false;try{const response=await request('/api/summary',{method:'POST',body:{}});acceptState(await response.json());ready=summaryReady();summaryApproved=ready;if(!ready)errorMessage='Complétez et enregistrez les trois cadres avant de préparer la synthèse.'}catch(error){if(!error.status)online=false;errorMessage=error.status?error.message:'La synthèse n’a pas pu être vérifiée. Vérifiez la connexion avant de réessayer.'}finally{busy=false;render()}if(ready){for(const reportLogo of app.querySelectorAll('.print-summary img'))try{await reportLogo.decode()}catch{}window.print()}}
app.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
  if(action==='close-session'){closeSession();return}if(action==='retry'){errorMessage='';stateFingerprint='';refresh();return}if(action==='open-presentation'){openView('presentation');return}if(action==='copy-presentation'){navigator.clipboard.writeText(state.links.presentation).then(()=>toast('Lien de présentation copié.')).catch(()=>window.prompt('Lien de présentation',state.links.presentation));return}if(action==='report'){downloadReport();return}if(action==='print-plan'){prepareSummary();return}
  if(action==='objective'){if(!planDraft)return;const stage=button.dataset.stage,id=button.dataset.criterion,n=Number(button.dataset.score);planDraft.objectives??={};planDraft.objectives[stage]??={};planDraft.objectives[stage][id]=planDraft.objectives[stage][id]===n?null:n;markPlanDirty();render();return}
  if(action==='score'){mutate('/api/score',{side:button.dataset.side,criterion:button.dataset.criterion,score:Number(button.dataset.score)});return}
  if(action==='lock'){mutate('/api/lock',{side:button.dataset.side},'Les six cartes sont verrouillées.');return}
  if(action==='reveal'){mutate('/api/reveal',{criterion:button.dataset.criterion});return}
  if(action==='save-plan'){const horizon=Number(planDraft.horizon);if(!Number.isInteger(horizon)||horizon<55||horizon>100){toast('Choisissez un âge repère entre 55 et 100 ans.');document.getElementById('plan-horizon').focus();return}const submitted={...planDraft,horizon,plan_revision:planDraftRevision};mutate('/api/plan',submitted,'Les cadres sont enregistrés.').then(success=>{if(success){planDirty=false;planDraft=clonePlan(state.plan);planDraftRevision=state.plan_revision;render()}})}
});
app.addEventListener('input',event=>{const key=event.target.dataset.plan;if(!key||!planDraft)return;planDraft[key]=event.target.value;markPlanDirty()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.addEventListener('beforeunload',event=>{if(planDirty){event.preventDefault();event.returnValue=''}});
window.addEventListener('beforeprint',()=>{if(!summaryReady()||!summaryApproved)app.querySelector('.print-summary')?.remove()});
window.addEventListener('afterprint',()=>{summaryApproved=false;app.querySelector('.print-summary')?.remove()});
if(token&&sessionId){refresh();refreshing=setInterval(()=>{if(!document.hidden)refresh()},1200)}
})();
</script>
<script src="team.js"></script>
