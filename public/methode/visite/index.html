:11px;font-size:10px}.waiting{padding:17px;align-items:flex-start}.topmeta .role-name{display:none}.score-anchors{font-size:10px}.privacy-note{padding:12px;font-size:12px}.hero-side .toolbar .button{font-size:11px}}

<body>
<header class="topbar"><div class="wordmark">Sourire<span>Plus</span> <span style="font-size:12px;letter-spacing:1px;margin-left:8px">LA MÉTHODE</span></div><div class="topmeta"><span class="badge demo">SÉANCE PARTAGÉE LOCALE</span><span class="role-name" id="roleName"></span><span class="connection" id="connection"><i class="dot"></i><span>Connexion…</span></span></div></header>
<main class="shell" id="app"><div class="loading"><div class="spinner" aria-hidden="true"></div><p>Ouverture de votre séance…</p></div></main>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div><div id="toast" class="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.hash.slice(1)),token=params.get('token'),sessionId=params.get('session');
const app=document.getElementById('app'),connection=document.getElementById('connection'),roleName=document.getElementById('roleName');
const lockIcon='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 14v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
let state=null,stateFingerprint='',busy=false,online=true,errorMessage='',pollPending=false,planDraft=null,planDirty=false,toastTimer=null,closed=false,refreshing=null,mutationEpoch=0,pendingPlanScroll=false,pendingBoardScroll=false,summaryApproved=false,planDraftRevision=0;
const animatedReveals=new Set();
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const criteria=()=>Array.isArray(state?.criteria)?state.criteria:[];
const isFilled=(side,id)=>Boolean(state?.filled?.[side]?.[id]);
const score=(side,id)=>state?.scores?.[side]?.[id];
const isRevealed=id=>(state?.revealed||[]).includes(id);
const count=side=>criteria().filter(c=>isFilled(side,c.id)).length;
const locked=side=>Boolean(state?.locked?.[side]);
const disabled=condition=>(condition||busy||!online||state?.closed)?' disabled':'';
const allRevealed=()=>criteria().length>0&&criteria().every(c=>isRevealed(c.id));
const summaryReady=()=>state?.role==='practitioner'&&state.summary_ready===true&&allRevealed()&&!planDirty;
const draftCount=()=>['essential','needs','strategy'].filter(key=>Boolean(planDraft?.[key]?.trim())).length;
const planStatus=()=>planDirty?'Modifications en cours, à enregistrer.':state?.summary_ready?'Les trois cadres sont enregistrés. La synthèse PDF est prête à être préparée.':'Complétez et enregistrez les trois cadres pour préparer la synthèse PDF.';
const roleLabel=role=>({presentation:'Écran de présentation',practitioner:'Écran praticien · Déborah'}[role]||'Séance');
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
function announce(message){document.getElementById('announcement').textContent=message}
function connectionStatus(){connection.className='connection'+(online?'':' offline');connection.innerHTML='<i class="dot"></i><span>'+(!online?'Connexion interrompue':busy?'Enregistrement…':'Séance enregistrée')+'</span>'}
function description(label){const key=label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(key.includes('align'))return 'La position de vos dents et leur harmonie.';if(key.includes('carie'))return 'Votre impression de la santé de vos dents.';if(key.includes('genc')||key.includes('paro'))return 'Le confort et la santé de vos gencives.';if(key.includes('rest'))return 'Votre ressenti sur les dents réparées ou remplacées.';if(key.includes('fonct'))return 'Le confort pour manger, parler et utiliser vos dents.';if(key.includes('esth'))return 'Le plaisir de sourire et l’apparence de vos dents.';return 'Votre perception personnelle, aujourd’hui.'}
function steps(){const index={patient:0,clinical:1,reveal:2,plan:3}[state.phase]??0;return '<nav class="steps" aria-label="Étapes de la séance">'+['Votre ressenti','Le bilan','La découverte','Les trois devis'].map((label,i)=>'<div class="step '+(i===index?'active':i<index?'done':'')+'"'+(i===index?' aria-current="step"':'')+'><b aria-hidden="true">'+(i<index?'✓':i+1)+'</b><span>'+label+'</span></div>').join('')+'</nav>'}
function hero(){let eyebrow,title,subtitle;
  if(state.role==='presentation'){
    eyebrow=!locked('patient')?'01 · Avec Jessica':allRevealed()?'Votre séance SourirePlus':'Vos six thèmes, deux regards';
    title=!locked('patient')?'D’abord, votre regard.':allRevealed()?'Votre sourire, votre projet.':locked('clinical')?'Découvrons les cartes ensemble.':'Votre ressenti est prêt.';
    subtitle=!locked('patient')?'Avec Jessica, donnez votre ressenti sur chacun des six thèmes. Touchez une note : il n’y a pas de bonne réponse, seul compte votre regard aujourd’hui.':allRevealed()?'Les six paires sont découvertes. Vous pouvez continuer l’échange pendant que le praticien et Déborah préparent les trois devis.':locked('clinical')?'Touchez « Découvrir cette paire » pour partager chaque thème avec le praticien, à votre rythme.':'Vos six cartes sont masquées en haut. Le praticien prépare son bilan sur son écran, sans voir vos notes.';
  }else{
    eyebrow=allRevealed()?'04 · Avec Déborah':'02 · Le regard clinique';
    title=allRevealed()?'Des regards partagés aux trois devis.':locked('clinical')?'Deux regards à découvrir.':'Votre bilan, en toute indépendance.';
    subtitle=allRevealed()?'Complétez les trois cadres avec Déborah, puis préparez la synthèse PDF.':locked('clinical')?'Les paires peuvent être découvertes depuis cet écran ou depuis l’écran de présentation.':'Saisissez puis verrouillez vos six notes sur cet écran. Les ressentis du patient restent masqués jusqu’à la découverte commune.';
  }
  const links=state.role==='practitioner'&&state.links?'<div class="toolbar"><button class="button small" data-action="open-presentation">Ouvrir l’écran de présentation ↗</button><button class="button small" data-action="copy-presentation">Copier le lien de présentation</button></div>':'';
  return '<section class="hero"><div><p class="eyebrow">'+eyebrow+'</p><h1>'+title+'</h1><p>'+subtitle+'</p>'+links+'</div><div class="hero-side"><div class="person">'+esc(state.patient?.name||'Patient de démonstration')+'</div><div class="dossier">Dossier '+esc(state.dossier||'000123')+' · séance enregistrée</div></div></section>';
}
function inputPanel(side){const patient=side==='patient',complete=count(side);
  if(locked(side))return '';
  if(!patient&&!locked('patient'))return '<section class="panel"><div class="waiting"><div class="waiting-mark">'+lockIcon+'</div><div><h3>Le ressenti est en cours sur l’écran de présentation.</h3><p>Jessica et le patient y choisissent les six notes. Dès qu’ils les verrouillent, vous pourrez saisir votre bilan ici, sans voir les ressentis.</p></div></div></section>';
  let out='<section class="panel" id="'+(patient?'patient-input':'clinical-input')+'"><div class="panel-head"><div><h2>'+(patient?'Vos six ressentis':'Les six notes du bilan')+'</h2><p>'+(patient?'Choisissez les notes avec Jessica sur cet écran tactile.':'Attribuez une note à chaque critère selon votre examen clinique.')+'</p></div><span class="counter">'+complete+' / '+criteria().length+' notes</span></div><div class="privacy-note">'+lockIcon+'<span>'+(patient?'Après le verrouillage, vos six cartes apparaîtront masquées. Le praticien découvrira vos notes avec vous.':'Les notes saisies ici restent confidentielles jusqu’à la découverte des paires.')+'</span></div><div class="score-grid">';
  for(const c of criteria()){const value=score(side,c.id);out+='<fieldset class="score-item"><legend>'+esc(c.label)+'</legend><div class="description">'+esc(patient?description(c.label):'Évaluation clinique de ce critère, selon votre examen.')+'</div><div class="score-options" role="group" aria-label="Note '+esc(c.label)+' de zéro à dix">';
    for(let n=0;n<=10;n++)out+='<button id="score-'+esc(c.id)+'-'+n+'" type="button" class="score-button '+(value===n?'selected':'')+'" data-action="score" data-side="'+side+'" data-criterion="'+esc(c.id)+'" data-score="'+n+'" aria-pressed="'+(value===n)+'" aria-label="'+esc(c.label)+' : '+n+' sur 10"'+disabled(false)+'>'+n+'</button>';
    out+='</div><div class="score-anchors"><span>0 · '+(patient?'très insatisfait':'très défavorable')+'</span><span>10 · '+(patient?'très satisfait':'très favorable')+'</span></div></fieldset>';
  }
  return out+'</div><div class="panel-foot"><p>Vérifiez les six notes avant de les verrouiller. Elles seront ensuite découvertes une paire à la fois.</p><button id="lock-'+side+'" class="button primary" data-action="lock" data-side="'+side+'"'+disabled(complete!==criteria().length)+'>'+(patient?'Verrouiller les six ressentis':'Verrouiller les six notes du bilan')+'</button></div></section>';
}
function card(side,c,animate){const value=score(side,c.id),revealed=isRevealed(c.id)&&Number.isInteger(value),filled=isFilled(side,c.id),label=side==='patient'?'Ressenti':'Bilan';
  if(revealed)return '<div class="card face '+(side==='clinical'?'clinical':'')+(animate?' just-revealed':'')+'" aria-label="'+esc(c.label)+' — '+label+' : '+value+' sur 10"><span class="score-number">'+value+'</span><span class="score-denominator">sur 10</span><span class="face-label">'+(side==='patient'?'Votre ressenti':'Le bilan clinique')+'</span></div>';
  if(filled)return '<div class="card back" aria-label="'+esc(c.label)+' — '+label+' : carte masquée"><span class="card-mark">'+lockIcon+'</span><span class="back-caption">À DÉCOUVRIR</span></div>';
  return '<div class="card empty" aria-label="'+esc(c.label)+' — '+label+' : en attente"><span class="empty-symbol" aria-hidden="true">+</span><span>Le bilan<br>à venir</span></div>';
}
function board(){if(!locked('patient'))return '';const revealed=state.revealed?.length||0,canReveal=locked('patient')&&locked('clinical');
  const text=allRevealed()?'Les six thèmes sont partagés. Chaque regard a sa place.':canReveal?'Choisissez une paire et prenez le temps d’écouter les deux regards.':'Les ressentis sont masqués en haut ; les cartes du bilan se préparent en dessous.';
  let out='<section class="panel board-panel" id="card-board" aria-labelledby="board-title"><div class="panel-head"><div><h2 id="board-title" tabindex="-1">'+(revealed?'La découverte, ensemble':'Les cartes de votre sourire')+'</h2><p>'+text+'</p></div><span class="counter gold">'+revealed+' / '+criteria().length+' paires découvertes</span></div><div class="board">';
  for(const c of criteria()){const show=isRevealed(c.id),animate=show&&!animatedReveals.has(c.id);out+='<article class="pair"><h3 class="criterion-heading">'+esc(c.label)+'</h3><div class="card-label">Ressenti</div>'+card('patient',c,animate)+'<div class="card-label second">Bilan</div>'+card('clinical',c,animate);
    if(show){const diff=Math.abs(score('patient',c.id)-score('clinical',c.id));out+='<div class="pair-note">'+(diff===0?'<strong>Deux regards qui se rejoignent.</strong>':diff===1?'Deux regards proches.':'Une différence à comprendre ensemble.')+'</div>';animatedReveals.add(c.id)}
    else if(canReveal)out+='<button id="reveal-'+esc(c.id)+'" class="button gold reveal-control" data-action="reveal" data-criterion="'+esc(c.id)+'"'+disabled(false)+'>Découvrir cette paire</button>';
    else out+='<div class="pair-note">Le bilan est en cours.</div>';
    out+='</article>';
  }
  out+='</div><div class="legend"><span><i></i>Ressenti du patient</span><span><i class="clinical-dot"></i>Observation du praticien</span></div>';
  if(revealed&&!allRevealed())out+='<div class="reveal-help">« Qu’est-ce qui vous a conduit à cette note ? »<br>Un écart n’est pas une erreur : le ressenti et l’examen apportent des informations différentes.</div>';
  else if(allRevealed())out+='<div class="reveal-help">Les six paires sont découvertes. Nous pouvons maintenant choisir les priorités et construire votre projet ensemble.</div>';
  return out+'</section>';
}
function observations(){if(state.role!=='practitioner'||(!state.report_available&&!(state.observations?.length)))return '';let out='<section class="panel"><details><summary>Le document DX fourni · observations à valider</summary><p>Ce document est un support de préparation. Il ne remplace pas l’examen clinique et n’attribue aucune note automatiquement.</p>';if(Array.isArray(state.observations))out+='<ul class="observation-list">'+state.observations.map(o=>'<li>'+(typeof o==='string'?esc(o):'<b>'+esc(o.label||'')+'</b> '+esc(o.text||''))+'</li>').join('')+'</ul>';if(state.report_available)out+='<div class="toolbar"><button class="button small" data-action="report"'+disabled(false)+'>Télécharger le rapport DX fourni ↓</button></div>';return out+'</details></section>'}
function planPanel(){if(state.role!=='practitioner'||!allRevealed())return '';const plan=planDraft;
  const categories=[['essential','Essentiel','Les priorités cliniques','Ce qui est nécessaire pour la santé, la stabilité et le confort.'],['needs','Besoins','Les attentes du patient','Ce qui répond aux ressentis et aux souhaits exprimés pendant l’échange.'],['strategy','Stratégie','La vision à long terme','Ce que le patient souhaite préserver pour bien vieillir.']];
  let out='<section class="panel" id="deborah-plan" aria-labelledby="deborah-title"><div class="panel-head"><div><p class="eyebrow">04 · Avec Déborah</p><h2 id="deborah-title" tabindex="-1">Les trois cadres pour les devis</h2><p>Précisez chaque orientation avec Déborah. Les trois cadres complétés et enregistrés permettront de préparer la synthèse PDF.</p></div><span class="counter" id="plan-count">'+draftCount()+' / 3 cadres</span></div><div class="plan-grid">';
  for(let i=0;i<categories.length;i++){const [key,title,subtitle,prompt]=categories[i];out+='<article class="plan-card"><div class="plan-index">0'+(i+1)+' · '+esc(subtitle)+'</div><h3>'+title+'</h3><p class="prompt">'+prompt+'</p><label class="sr-only" for="plan-'+key+'">'+title+' — orientations pour Déborah</label><textarea id="plan-'+key+'" data-plan="'+key+'" maxlength="5000" placeholder="'+(key==='essential'?'Priorités et ordre des soins à proposer…':key==='needs'?'Attentes retenues avec le patient…':'Fonctions à préserver, entretien, options futures…')+'"'+disabled(false)+'>'+esc(plan?.[key]||'')+'</textarea>';
    if(key==='strategy')out+='<div class="horizon"><label for="plan-horizon">Âge repère du projet</label><input id="plan-horizon" type="number" data-plan="horizon" min="55" max="100" step="1" value="'+esc(plan?.horizon??70)+'"'+disabled(false)+'><span>ans</span></div><p class="subtle" style="margin-top:11px">Un horizon de discussion personnalisable, pas une norme ni une promesse de résultat.</p>';
    out+='</article>';
  }
  return out+'</div><div class="panel-foot"><p id="plan-save-status" class="plan-status" aria-live="polite">'+planStatus()+'</p><div class="plan-footer-actions"><button id="save-plan" class="button primary" data-action="save-plan"'+disabled(false)+'>Enregistrer les trois cadres</button><button id="prepare-summary" class="button gold" data-action="print-plan"'+(summaryReady()?'':' hidden')+disabled(!summaryReady())+'>Préparer la synthèse PDF</button></div></div><p class="subtle plan-complete">Ces orientations servent à préparer les devis. La synthèse peut être enregistrée en PDF depuis la fenêtre d’impression.</p></section>';
}
function printSummary(){if(!summaryReady()||!summaryApproved)return '';let out='<section class="print-summary" data-ready="true"><p class="eyebrow">Méthode SourirePlus · synthèse de séance</p><h1>Synthèse des orientations pour Déborah</h1><p><strong>'+esc(state.patient?.name||'Patient de démonstration')+'</strong> · Dossier '+esc(state.dossier)+'</p><table><thead><tr><th>Critère</th><th>Ressenti / 10</th><th>Bilan / 10</th></tr></thead><tbody>';for(const c of criteria())out+='<tr><td>'+esc(c.label)+'</td><td>'+esc(score('patient',c.id))+'</td><td>'+esc(score('clinical',c.id))+'</td></tr>';out+='</tbody></table>';for(const [key,title] of [['essential','1. Essentiel'],['needs','2. Besoins'],['strategy','3. Stratégie']])out+='<section><h2>'+title+'</h2><div class="print-plan">'+esc(state.plan[key])+'</div></section>';return out+'<p>Âge repère du projet : <strong>'+esc(state.plan.horizon)+' ans</strong>. Horizon personnalisable, sans valeur de norme ni de promesse.</p><p>Orientations à discuter et à chiffrer dans ZaWin. Cette synthèse ne constitue pas un devis.</p></section>'}
function performPendingScroll(){const targetId=pendingPlanScroll?'deborah-plan':pendingBoardScroll?'card-board':null;if(!targetId)return;pendingPlanScroll=false;pendingBoardScroll=false;requestAnimationFrame(()=>{const target=document.getElementById(targetId);if(!target)return;target.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});target.querySelector('h2')?.focus({preventScroll:true})})}
function render(){connectionStatus();if(!state)return;const focus=document.activeElement?.id,selection=document.activeElement?.selectionStart;roleName.textContent=roleLabel(state.role);app.classList.toggle('presentation-view',state.role==='presentation');const error=errorMessage?'<div class="error-banner" role="alert"><span>'+esc(errorMessage)+'</span><button class="button small" data-action="retry">Réessayer</button></div>':'';app.innerHTML=hero()+steps()+error+inputPanel(state.role==='presentation'?'patient':'clinical')+board()+planPanel()+observations()+printSummary()+'<footer class="footer"><span>Votre ressenti face à la réalité, notre expertise pour votre tranquillité.</span><span>Séance conservée · échange des cartes entre les deux écrans</span>'+(state.role==='practitioner'?'<button class="button small ghost" data-action="close-session">Terminer la séance</button>':'')+'</footer>';if(focus){const target=document.getElementById(focus);if(target&&!target.disabled){target.focus({preventScroll:true});if(typeof selection==='number'&&target.setSelectionRange)try{target.setSelectionRange(selection,selection)}catch{}}}if(!busy)performPendingScroll()}
function acceptState(next){if(next.closed){closed=true;clearInterval(refreshing);app.innerHTML='<div class="loading"><h1>La séance est terminée.</h1><p>Les notes et les orientations enregistrées sont conservées dans l’espace équipe.</p></div>';return}const previous=state,previousReveal=previous?.revealed?.length||0;const fingerprint=JSON.stringify(next);if(fingerprint!==stateFingerprint)summaryApproved=false;
  if(previous&&next.role==='practitioner'&&next.revealed?.length===next.criteria?.length&&previousReveal<next.revealed.length)pendingPlanScroll=true;
  if(previous&&next.role==='presentation'&&!previous.locked?.patient&&next.locked?.patient)pendingBoardScroll=true;
  state=next;if(!planDraft||!planDirty){planDraft={essential:next.plan?.essential||'',needs:next.plan?.needs||'',strategy:next.plan?.strategy||'',horizon:next.plan?.horizon??70};planDraftRevision=next.plan_revision??0;}
  if(fingerprint!==stateFingerprint||!online||errorMessage){stateFingerprint=fingerprint;online=true;errorMessage='';if(!busy)render()}else{online=true;connectionStatus()}
  if((next.revealed?.length||0)>previousReveal)announce(next.revealed.length===next.criteria?.length?'Les six paires sont découvertes. Les trois cadres de devis sont disponibles sur l’écran praticien.':'Une nouvelle paire de cartes est découverte.');
}
async function request(path,{method='GET',body}={}){const headers={'X-SourirePlus-Token':token,'X-SourirePlus-Session':sessionId};if(body!==undefined)headers['Content-Type']='application/json';const response=await fetch('api.php?action='+encodeURIComponent(path.replace('/api/','')),{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',credentials:'omit'});if(!response.ok){let payload={};try{payload=await response.json()}catch{}const error=new Error(response.status===401?'Ce lien de séance n’est plus valide. Rouvrez la vue depuis le lanceur.':response.status===403?'Cette action appartient à un autre écran de la séance.':payload.error||'L’action n’a pas pu être enregistrée.');error.status=response.status;throw error}return response}
async function refresh(){if(pollPending||busy||closed||!token)return;const epoch=mutationEpoch;pollPending=true;try{const response=await request('/api/state'),next=await response.json();if(epoch===mutationEpoch&&!busy)acceptState(next)}catch(error){if(epoch!==mutationEpoch||busy)return;online=false;errorMessage=error.status?error.message:'La connexion est interrompue. Vérifiez le réseau ; les données déjà confirmées restent conservées.';if(state)render();else{connectionStatus();app.innerHTML='<div class="loading"><p>'+esc(errorMessage)+'</p><button class="button" data-action="retry">Réessayer</button></div>'}}finally{pollPending=false}}
async function mutate(path,body,message){if(busy||!online)return false;const activeId=document.activeElement?.id;busy=true;summaryApproved=false;mutationEpoch++;render();let success=false;try{const response=await request(path,{method:'POST',body}),next=await response.json();acceptState(next);errorMessage='';success=true;if(message)toast(message)}catch(error){if(!error.status)online=false;errorMessage=error.status?error.message:'La connexion a été interrompue. La dernière action n’est pas confirmée ; vérifiez les cartes avant de la reprendre.'}finally{busy=false;render();const active=activeId&&document.getElementById(activeId);if(active&&!active.disabled)active.focus({preventScroll:true})}return success}
async function closeSession(){if(!window.confirm('Terminer la séance ? Les notes et les orientations enregistrées seront conservées. Les modifications de texte non enregistrées seront perdues.'))return;try{await request('/api/close',{method:'POST',body:{}});closed=true;clearInterval(refreshing);state=null;planDraft=null;planDirty=false;summaryApproved=false;roleName.textContent='';connection.innerHTML='<span>Séance terminée</span>';app.innerHTML='<div class="loading"><h1>La séance est enregistrée et terminée.</h1><p>Vous pouvez fermer cet onglet. La séance reste accessible depuis l’espace équipe.</p></div>'}catch(error){toast(error.status?error.message:'La fermeture n’a pas pu être confirmée. Vérifiez la connexion réseau.')}}
function openView(role){const raw=state.links?.[role];if(!raw)return;try{const url=new URL(raw,location.href);if(url.origin!==location.origin)return;window.open(url.href,'_blank','popup=yes,width=1280,height=900,noopener,noreferrer')}catch{toast('Le lien de cet écran n’est pas disponible.')}}
async function downloadReport(){if(busy||!online)return;busy=true;connectionStatus();try{const response=await request('/api/report'),blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Rapport_DX_demonstration.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Le rapport fourni a été téléchargé.')}catch(error){toast(error.status?error.message:'Le document n’a pas pu être téléchargé.')}finally{busy=false;connectionStatus()}}
async function prepareSummary(){if(busy||!online||!summaryReady())return;busy=true;summaryApproved=false;mutationEpoch++;render();let ready=false;try{const response=await request('/api/summary',{method:'POST',body:{}});acceptState(await response.json());ready=summaryReady();summaryApproved=ready;if(!ready)errorMessage='Complétez et enregistrez les trois cadres avant de préparer la synthèse.'}catch(error){if(!error.status)online=false;errorMessage=error.status?error.message:'La synthèse n’a pas pu être vérifiée. Vérifiez la connexion avant de réessayer.'}finally{busy=false;render()}if(ready)window.print()}
app.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
  if(action==='close-session'){closeSession();return}if(action==='retry'){errorMessage='';stateFingerprint='';refresh();return}if(action==='open-presentation'){openView('presentation');return}if(action==='copy-presentation'){navigator.clipboard.writeText(state.links.presentation).then(()=>toast('Lien de présentation copié.')).catch(()=>window.prompt('Lien de présentation',state.links.presentation));return}if(action==='report'){downloadReport();return}if(action==='print-plan'){prepareSummary();return}
  if(action==='score'){mutate('/api/score',{side:button.dataset.side,criterion:button.dataset.criterion,score:Number(button.dataset.score)});return}
  if(action==='lock'){mutate('/api/lock',{side:button.dataset.side},'Les six cartes sont verrouillées.');return}
  if(action==='reveal'){mutate('/api/reveal',{criterion:button.dataset.criterion});return}
  if(action==='save-plan'){const horizon=Number(planDraft.horizon);if(!Number.isInteger(horizon)||horizon<55||horizon>100){toast('Choisissez un âge repère entre 55 et 100 ans.');document.getElementById('plan-horizon').focus();return}const submitted={...planDraft,horizon,plan_revision:planDraftRevision};mutate('/api/plan',submitted,'Les cadres sont enregistrés.').then(success=>{if(success){planDirty=false;planDraft={...state.plan};planDraftRevision=state.plan_revision;render()}})}
});
app.addEventListener('input',event=>{const key=event.target.dataset.plan;if(!key||!planDraft)return;planDraft[key]=event.target.value;planDirty=true;summaryApproved=false;const status=document.getElementById('plan-save-status');if(status)status.textContent=planStatus();const counter=document.getElementById('plan-count');if(counter)counter.textContent=draftCount()+' / 3 cadres';const button=document.getElementById('prepare-summary');if(button){button.disabled=true;button.hidden=true}app.querySelector('.print-summary')?.remove()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.addEventListener('beforeunload',event=>{if(planDirty){event.preventDefault();event.returnValue=''}});
window.addEventListener('beforeprint',()=>{if(!summaryReady()||!summaryApproved)app.querySelector('.print-summary')?.remove()});
window.addEventListener('afterprint',()=>{summaryApproved=false;app.querySelector('.print-summary')?.remove()});
if(token&&sessionId){refresh();refreshing=setInterval(()=>{if(!document.hidden)refresh()},1200)}
})();
</script>
<script src="team.js"></script>
</body>
