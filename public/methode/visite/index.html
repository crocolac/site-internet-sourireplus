    }

    function treatmentRow(c) {
      const clinical = state.clinician[c.id];
      const objective = state.objective[c.id];
      const from = Math.min(clinical, objective);
      const to = Math.max(clinical, objective);
      return `<div class="comparison-row">
        <div class="criterion-label"><i class="color-dot" style="--c:${c.color}"></i>${c.name}</div>
        <div class="score-track" role="img" aria-label="${c.name} : constat clinique ${clinical}, objectif ${objective} sur 10">
          <i class="impact-line" style="--from:${from};--to:${to}"></i>
          <i class="track-marker clinical" style="--score:${clinical}"></i>
          <i class="track-marker objective" style="--score:${objective}"></i>
        </div>
        <div class="comparison-values">Clinique <strong>${clinical}/10</strong> · Objectif <strong>${objective}/10</strong></div>
      </div>`;
    }

    function effectItems() {
      const effects = criteria
        .map(c => ({c, delta: state.objective[c.id] - state.clinician[c.id]}))
        .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
      const changed = effects.filter(item => item.delta !== 0).slice(0, 3);
      if (!changed.length) return '<p class="empty-discussion">Cette solution vise à maintenir les six critères à leur niveau actuel.</p>';
      return changed.map(({c, delta}) => `<div class="effect-item" style="--c:${c.color}"><strong>${c.name} · ${delta > 0 ? '+' : '−'}${Math.abs(delta)} point${Math.abs(delta) > 1 ? 's' : ''}</strong><span>${state.clinician[c.id]}/10 aujourd’hui → ${state.objective[c.id]}/10 après traitement</span></div>`).join('');
    }

    function summaryView() {
      const patientValues = criteria.map(c => state.patient[c.id]).filter(Number.isFinite);
      const clinicalValues = criteria.map(c => state.clinician[c.id]);
      const objectiveValues = criteria.map(c => state.objective[c.id]);
      const patientMean = patientValues.length ? average(patientValues) : null;
      const clinicalMean = average(clinicalValues);
      const objectiveMean = average(objectiveValues);
      const patientValue = patientMean === null ? '—' : formatScore(patientMean);
      const patientNote = patientValues.length === 6 ? 'Moyenne des 6 critères' : `Moyenne de ${patientValues.length}/6 critères renseignés`;
      const finalSentence = objectiveMean >= clinicalMean
        ? `Avec cette solution, l’objectif est de faire passer votre bouche de ${formatShortScore(clinicalMean)}/10 à ${formatShortScore(objectiveMean)}/10.`
        : `Avec cette solution, l’objectif clinique évolue de ${formatShortScore(clinicalMean)}/10 à ${formatShortScore(objectiveMean)}/10.`;
      return `
        <section>
          <div class="final-message">
            <p class="method-signature">4 · Synthèse de la Méthode SourirePlus</p>
            <h2>Votre situation en trois notes.</h2>
            <p>Les notes cliniques sont la moyenne des six critères. Votre ressenti est calculé uniquement sur les critères auxquels vous avez répondu.</p>
          </div>
          <div class="triple-score" aria-label="Notes globales du ressenti, du constat clinique et de l’objectif">
            <div class="global-score patient">
              <p class="global-label">Votre ressenti</p>
              <div class="global-value">${patientValue}${patientMean === null ? '' : '<small>/10</small>'}</div>
              <p class="global-note">${patientNote}</p>
            </div>
            <div class="global-score clinical">
              <p class="global-label">Le constat clinique</p>
              <div class="global-value">${formatScore(clinicalMean)}<small>/10</small></div>
              <p class="global-note">Moyenne des 6 critères</p>
            </div>
            <div class="global-score objective">
              <p class="global-label">L’objectif proposé</p>
              <div class="global-value">${formatScore(objectiveMean)}<small>/10</small></div>
              <p class="global-note">Moyenne des 6 critères projetés</p>
            </div>
          </div>
          <div class="final-message">
            <h2>${finalSentence}</h2>
            <p>Ces trois notes ne remplacent pas l’analyse détaillée : elles rendent simplement le projet facile à comprendre et à discuter.</p>
          </div>
          <div class="scale-warning">
            <span aria-hidden="true">S+</span>
            <div><strong>La Méthode SourirePlus.</strong> Votre ressenti, l’évaluation clinique, les repères de vie et l’objectif du traitement réunis pour décider ensemble.</div>
          </div>
          <div class="report-actions">
            <div>
              <h3>Télécharger la présentation de votre visite</h3>
              <p>Le rapport PDF reprend les quatre étapes : ressenti, évaluation clinique, repères de vie et objectif. Il est créé directement sur cet appareil.</p>
              <p class="report-status" id="reportStatus" role="status" aria-live="polite"></p>
            </div>
            <button class="btn" id="generateReportBtn" type="button">Générer le rapport PDF</button>
          </div>
        </section>`;
    }

    function average(values) {
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    }

    function formatScore(value) {
      return value.toLocaleString('fr-CH', {minimumFractionDigits: 1, maximumFractionDigits: 1});
    }

    function formatShortScore(value) {
      return value.toLocaleString('fr-CH', {maximumFractionDigits: 1});
    }

    function discussionItems() {
      const unknown = criteria.filter(c => state.patient[c.id] === 'unknown');
      const gaps = criteria
        .filter(c => typeof state.patient[c.id] === 'number')
        .map(c => ({c, gap: Math.abs(state.patient[c.id] - state.clinician[c.id])}))
        .filter(x => x.gap >= 3)
        .sort((a,b) => b.gap - a.gap);
      const patientLowScores = criteria.filter(c => typeof state.patient[c.id] === 'number' && state.patient[c.id] <= 4);
      const items = [];
      unknown.forEach(c => items.push(`<div class="discussion-item" style="--c:${c.color}"><strong>${c.name}</strong><span>Vous avez choisi « Je ne sais pas » : le praticien vous expliquera ce point.</span></div>`));
      gaps.slice(0, 3).forEach(({c, gap}) => items.push(`<div class="discussion-item" style="--c:${c.color}"><strong>${c.name}</strong><span>Les deux regards diffèrent de ${gap} points : cherchons ensemble ce qui explique cet écart.</span></div>`));
      patientLowScores.filter(c => !gaps.some(x => x.c.id === c.id)).slice(0, 2).forEach(c => items.push(`<div class="discussion-item" style="--c:${c.color}"><strong>${c.name}</strong><span>Vous avez donné ${state.patient[c.id]}/10 : précisons ce qui motive votre ressenti.</span></div>`));
      return items.length ? items.slice(0, 4).join('') : '<p class="empty-discussion">Les deux regards sont proches. Le dialogue peut porter directement sur les objectifs à préserver ou à améliorer.</p>';
    }

    function renderChart() {
      const svg = document.getElementById('chart');
      if (!svg) return;
      const width = Math.max(310, Math.round(svg.getBoundingClientRect().width));
      const height = width < 560 ? 390 : 460;
      const margin = width < 560 ? {top:42,right:34,bottom:44,left:36} : {top:44,right:46,bottom:48,left:46};
      const innerW = width - margin.left - margin.right;
      const innerH = height - margin.top - margin.bottom;
      const xMin = 10;
      const xMax = state.age > 80 ? Math.min(100, Math.ceil(state.age / 10) * 10) : 80;
      const x = age => margin.left + ((age - xMin) / (xMax - xMin)) * innerW;
      const y = value => margin.top + innerH - (value / 100) * innerH;
      const changed = solutionCriteria();
      const visible = state.filter === 'all'
        ? criteria
        : (state.filter === 'treatment' ? (changed.length ? changed : criteria) : criteria.filter(c => c.id === state.filter));
      const visibleIds = new Set(visible.map(c => c.id));
      const singleCurve = visible.length === 1;
      const parts = [];

      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('height', height);

      for (let value = 0; value <= 100; value += 20) {
        parts.push(`<line x1="${margin.left}" y1="${y(value)}" x2="${width-margin.right}" y2="${y(value)}" stroke="#e4e5e8" stroke-width="1"/>`);
        parts.push(`<text x="${margin.left-8}" y="${y(value)+4}" text-anchor="end" fill="#777a82" font-size="11">${value}</text>`);
      }

      const ageStep = width < 560 ? 20 : 10;
      for (let age = 10; age <= xMax; age += ageStep) {
        parts.push(`<line x1="${x(age)}" y1="${margin.top}" x2="${x(age)}" y2="${height-margin.bottom}" stroke="#f0f0f2" stroke-width="1"/>`);
        parts.push(`<text x="${x(age)}" y="${height-margin.bottom+25}" text-anchor="middle" fill="#777a82" font-size="11">${age}</text>`);
      }
      parts.push(`<text x="${width/2}" y="${height-7}" text-anchor="middle" fill="#777a82" font-size="11">Âge</text>`);
      parts.push(`<text x="${margin.left}" y="${margin.top-17}" fill="#777a82" font-size="11">Population concernée (%)</text>`);
      const ageX = x(Math.min(state.age, xMax));
      parts.push(`<rect x="${ageX-12}" y="${margin.top}" width="24" height="${innerH}" rx="12" fill="#101114" opacity=".035"/>`);
      parts.push(`<line x1="${ageX}" y1="${margin.top-8}" x2="${ageX}" y2="${height-margin.bottom}" stroke="#101114" stroke-width="1.5" stroke-dasharray="4 5"/>`);

      referenceSeries.forEach(series => {
        if (!visibleIds.has(series.id)) return;
        const points = series.points.filter(p => p[0] <= xMax).map(p => [x(p[0]), y(p[1])]);
        const color = colorById[series.id];
        parts.push(`<path d="${smoothPath(points)}" fill="none" stroke="${color}" stroke-width="${state.filter === 'all' ? 3 : 5}" stroke-linecap="round" stroke-linejoin="round" opacity="${state.filter === 'all' ? .34 : .78}"/>`);
        const valueAtAge = interpolateSeries(series.points, state.age);
        if (valueAtAge !== null) {
          const dotX = ageXValue(state.age, x, xMax);
          const dotY = y(valueAtAge);
          parts.push(`<circle cx="${dotX}" cy="${dotY}" r="${state.filter === 'all' ? 4 : 7}" fill="${color}" stroke="white" stroke-width="3"><title>${criteria.find(c => c.id === series.id).name} : environ ${Math.round(valueAtAge)} % de population concernée à ${state.age} ans</title></circle>`);
          if (singleCurve) {
            const labelX = Math.min(width - margin.right - 48, dotX + 12);
            const labelY = Math.max(margin.top + 6, dotY - 30);
            parts.push(`<rect x="${labelX}" y="${labelY}" width="54" height="25" rx="12.5" fill="${color}"/>`);
            parts.push(`<text x="${labelX + 27}" y="${labelY + 17}" text-anchor="middle" fill="white" font-size="11" font-weight="800">${Math.round(valueAtAge)} %</text>`);
          }
        }
      });

      parts.push(`<rect x="${Math.max(margin.left, Math.min(ageX-27, width-margin.right-54))}" y="8" width="54" height="25" rx="12.5" fill="#101114"/>`);
      parts.push(`<text x="${Math.max(margin.left+27, Math.min(ageX, width-margin.right-27))}" y="25" text-anchor="middle" fill="white" font-size="11" font-weight="700">${state.age} ans</text>`);

      svg.innerHTML = parts.join('');
    }

    function ageXValue(age, scale, xMax) {
      return scale(Math.min(age, xMax));
    }

    function interpolateSeries(points, age) {
      if (age < points[0][0] || age > points[points.length - 1][0]) return null;
      for (let index = 0; index < points.length - 1; index++) {
        const current = points[index];
        const next = points[index + 1];
        if (age >= current[0] && age <= next[0]) {
          const ratio = (age - current[0]) / (next[0] - current[0]);
          return current[1] + (next[1] - current[1]) * ratio;
        }
      }
      return points[points.length - 1][1];
    }

    function smoothPath(points) {
      if (!points.length) return '';
      if (points.length === 1) return `M ${points[0][0]} ${points[0][1]}`;
      let d = `M ${points[0][0]} ${points[0][1]}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;
        const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
        const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
        const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
        const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2[0]} ${p2[1]}`;
      }
      return d;
    }

    function reportRoundRect(ctx, x, y, width, height, radius, fill, stroke) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      const words = String(text).split(/\s+/);
      const lines = [];
      let line = '';
      const limit = maxLines || 99;
      words.forEach(word => {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      const visible = lines.slice(0, limit);
      visible.forEach((item, index) => {
        let value = item;
        if (index === limit - 1 && lines.length > limit) {
          while (ctx.measureText(value + '...').width > maxWidth && value.length) value = value.slice(0, -1);
          value += '...';
        }
        ctx.fillText(value, x, y + index * lineHeight);
      });
      return y + visible.length * lineHeight;
    }

    function makeReportPage(kicker, title, subtitle, pageNumber) {
      const canvas = document.createElement('canvas');
      canvas.width = 1600;
      canvas.height = 1131;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f6f6f4';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const segment = canvas.width / criteria.length;
      criteria.forEach((criterion, index) => {
        ctx.fillStyle = criterion.color;
        ctx.fillRect(index * segment, 0, Math.ceil(segment), 12);
      });
      reportRoundRect(ctx, 72, 52, 58, 58, 29, '#101114');
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 23px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('S+', 101, 89);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#101114';
      ctx.font = '800 21px Arial, sans-serif';
      ctx.fillText('LA MÉTHODE SOURIREPLUS', 150, 90);
      ctx.fillStyle = '#6e7178';
      ctx.font = '700 19px Arial, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(pageNumber + ' / 4', 1525, 88);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#6e7178';
      ctx.font = '800 18px Arial, sans-serif';
      ctx.fillText(kicker.toUpperCase(), 80, 164);
      ctx.fillStyle = '#101114';
      ctx.font = '700 50px Arial, sans-serif';
      drawWrappedText(ctx, title, 80, 222, 1190, 56, 2);
      ctx.fillStyle = '#6e7178';
      ctx.font = '400 23px Arial, sans-serif';
      drawWrappedText(ctx, subtitle, 80, 276, 1260, 31, 2);
      ctx.strokeStyle = '#d9dadd';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(80, 1064);
      ctx.lineTo(1520, 1064);
      ctx.stroke();
      ctx.fillStyle = '#6e7178';
      ctx.font = '400 17px Arial, sans-serif';
      ctx.fillText('Patient : ' + state.age + ' ans', 80, 1097);
      ctx.textAlign = 'right';
      ctx.fillText('Objectif clinique estimé - Méthode SourirePlus', 1520, 1097);
      ctx.textAlign = 'left';
      return {canvas: canvas, ctx: ctx};
    }

    function drawReportTrack(ctx, x, y, width, patient, clinical, objective) {
      ctx.strokeStyle = '#d4d6da';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + width, y);
      ctx.stroke();
      ctx.fillStyle = '#8a8d93';
      ctx.font = '400 15px Arial, sans-serif';
      ctx.fillText('0', x - 4, y + 29);
      ctx.textAlign = 'right';
      ctx.fillText('10', x + width + 8, y + 29);
      ctx.textAlign = 'left';
      if (typeof patient === 'number') {
        const px = x + width * patient / 10;
        ctx.beginPath();
        ctx.arc(px, y - 11, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#1473e6';
        ctx.lineWidth = 5;
        ctx.stroke();
      }
      if (typeof clinical === 'number') {
        const cx = x + width * clinical / 10;
        ctx.save();
        ctx.translate(cx, y + 12);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = '#101114';
        ctx.fillRect(-8, -8, 16, 16);
        ctx.restore();
      }
      if (typeof objective === 'number') {
        const ox = x + width * objective / 10;
        ctx.beginPath();
        ctx.arc(ox, y - 11, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#078878';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }

    function createComparisonReportPage() {
      const page = makeReportPage(
        '1 - Ressenti et évaluation clinique',
        'Deux regards sur la situation actuelle',
        'Un écart n’est pas une erreur : il indique simplement ce qu’il faut expliquer ou examiner ensemble.',
        1
      );
      const ctx = page.ctx;
      criteria.forEach((criterion, index) => {
        const y = 330 + index * 113;
        reportRoundRect(ctx, 80, y, 1440, 92, 18, '#ffffff', '#e1e2e5');
        ctx.fillStyle = criterion.color;
        ctx.beginPath();
        ctx.arc(111, y + 46, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#101114';
        ctx.font = '700 23px Arial, sans-serif';
        ctx.fillText(criterion.name, 134, y + 42);
        ctx.fillStyle = '#6e7178';
        ctx.font = '400 17px Arial, sans-serif';
        ctx.fillText('0 = situation très mauvaise, 10 = excellente', 134, y + 68);
        drawReportTrack(ctx, 520, y + 46, 650, state.patient[criterion.id], state.clinician[criterion.id]);
        const patientValue = state.patient[criterion.id] === 'unknown' ? 'Je ne sais pas' : state.patient[criterion.id] + '/10';
        ctx.fillStyle = '#1473e6';
        ctx.font = '700 20px Arial, sans-serif';
        ctx.fillText('Ressenti ' + patientValue, 1215, y + 36);
        ctx.fillStyle = '#101114';
        ctx.fillText('Clinique ' + state.clinician[criterion.id] + '/10', 1215, y + 65);
      });
      return page.canvas;
    }

    function drawPopulationReportChart(ctx, x0, y0, width, height, visibleCriteria) {
      reportRoundRect(ctx, x0, y0, width, height, 22, '#ffffff', '#e1e2e5');
      const margin = {left: 68, right: 34, top: 76, bottom: 60};
      const innerW = width - margin.left - margin.right;
      const innerH = height - margin.top - margin.bottom;
      const xMax = state.age > 80 ? 100 : 80;
      const x = age => x0 + margin.left + ((age - 10) / (xMax - 10)) * innerW;
      const y = value => y0 + margin.top + innerH - value / 100 * innerH;
      ctx.fillStyle = '#6e7178';
      ctx.font = '700 18px Arial, sans-serif';
      ctx.fillText('Population concernée (%)', x0 + 28, y0 + 42);
      for (let value = 0; value <= 100; value += 20) {
        ctx.strokeStyle = '#e5e6e8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x0 + margin.left, y(value));
        ctx.lineTo(x0 + width - margin.right, y(value));
        ctx.stroke();
        ctx.fillStyle = '#777a82';
        ctx.font = '400 16px Arial, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(String(value), x0 + margin.left - 13, y(value) + 5);
      }
      const ageStep = xMax === 100 ? 15 : 10;
      for (let age = 10; age <= xMax; age += ageStep) {
        ctx.fillStyle = '#777a82';
        ctx.textAlign = 'center';
        ctx.fillText(String(age), x(age), y0 + height - 24);
      }
      ctx.textAlign = 'left';
      const markerAge = Math.min(state.age, xMax);
      ctx.strokeStyle = '#101114';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 9]);
      ctx.beginPath();
      ctx.moveTo(x(markerAge), y0 + margin.top - 12);
      ctx.lineTo(x(markerAge), y0 + height - margin.bottom);
      ctx.stroke();
      ctx.setLineDash([]);
      const ids = new Set(visibleCriteria.map(item => item.id));
      referenceSeries.forEach(series => {
        if (!ids.has(series.id)) return;
        ctx.strokeStyle = colorById[series.id];
        ctx.lineWidth = 7;
        ctx.globalAlpha = .72;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        let started = false;
        series.points.filter(point => point[0] <= xMax).forEach(point => {
          if (!started) {
            ctx.moveTo(x(point[0]), y(point[1]));
            started = true;
          } else {
            ctx.lineTo(x(point[0]), y(point[1]));
          }
        });
        ctx.stroke();
        ctx.globalAlpha = 1;
        const valueAtAge = interpolateSeries(series.points, state.age);
        if (valueAtAge !== null) {
          ctx.beginPath();
          ctx.arc(x(state.age), y(valueAtAge), 11, 0, Math.PI * 2);
          ctx.fillStyle = colorById[series.id];
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      });
      reportRoundRect(ctx, Math.max(x0 + margin.left, Math.min(x(markerAge) - 43, x0 + width - margin.right - 86)), y0 + 22, 86, 36, 18, '#101114');
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 17px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.age + ' ans', Math.max(x0 + margin.left + 43, Math.min(x(markerAge), x0 + width - margin.right - 43)), y0 + 46);
      ctx.textAlign = 'left';
    }

    function createPopulationReportPage() {
      const page = makeReportPage(
        '2 - Repères de vie',
        'Votre solution à ' + state.age + ' ans',
        'Les courbes montrent à quel point les prises en charge proposées sont fréquentes au même âge.',
        2
      );
      const ctx = page.ctx;
      const changed = solutionCriteria();
      const visible = changed.length ? changed : criteria;
      drawPopulationReportChart(ctx, 80, 330, 900, 665, visible);
      reportRoundRect(ctx, 1020, 330, 500, 665, 22, '#101114');
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 27px Arial, sans-serif';
      ctx.fillText('Le message à retenir', 1053, 377);
      ctx.fillStyle = '#c9cbd1';
      ctx.font = '400 18px Arial, sans-serif';
      drawWrappedText(ctx, 'Le point coloré marque le croisement entre votre âge et la courbe. Il indique une proportion de population, pas votre note.', 1053, 410, 430, 25, 4);
      if (!changed.length) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 24px Arial, sans-serif';
        drawWrappedText(ctx, 'Aucun critère n’a été modifié dans la projection.', 1053, 520, 420, 32, 3);
      } else {
        changed.forEach((criterion, index) => {
          const y = 500 + index * 78;
          const series = referenceSeries.find(item => item.id === criterion.id);
          const value = interpolateSeries(series.points, state.age);
          ctx.fillStyle = criterion.color;
          ctx.font = '800 25px Arial, sans-serif';
          ctx.fillText(value === null ? '—' : Math.round(value) + ' %', 1053, y);
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 18px Arial, sans-serif';
          ctx.fillText(criterion.name, 1150, y);
          ctx.fillStyle = '#c9cbd1';
          ctx.font = '400 16px Arial, sans-serif';
          const fact = value === null
            ? 'Repère disponible jusqu’à 80 ans.'
            : 'Environ ' + Math.round(value) + ' % de la population est concernée à ' + state.age + ' ans.';
          drawWrappedText(ctx, fact, 1150, y + 24, 330, 21, 2);
        });
      }
      return page.canvas;
    }

    function createTreatmentReportPage() {
      const page = makeReportPage(
        '3 - Avant et après le traitement',
        'L’effet attendu de la solution',
        'Pour chaque critère, la situation actuelle est comparée à l’objectif estimé après traitement.',
        3
      );
      const ctx = page.ctx;
      criteria.forEach((criterion, index) => {
        const y = 330 + index * 113;
        reportRoundRect(ctx, 80, y, 1440, 92, 18, '#ffffff', '#e1e2e5');
        ctx.fillStyle = criterion.color;
        ctx.beginPath();
        ctx.arc(111, y + 46, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#101114';
        ctx.font = '700 23px Arial, sans-serif';
        ctx.fillText(criterion.name, 134, y + 42);
        const delta = state.objective[criterion.id] - state.clinician[criterion.id];
        ctx.fillStyle = delta === 0 ? '#6e7178' : '#078878';
        ctx.font = '700 18px Arial, sans-serif';
        ctx.fillText(delta === 0 ? 'Maintien' : (delta > 0 ? '+' : '') + delta + ' point' + (Math.abs(delta) === 1 ? '' : 's'), 134, y + 68);
        drawReportTrack(ctx, 520, y + 46, 650, null, state.clinician[criterion.id], state.objective[criterion.id]);
        ctx.fillStyle = '#101114';
        ctx.font = '700 20px Arial, sans-serif';
        ctx.fillText('Clinique ' + state.clinician[criterion.id] + '/10', 1215, y + 36);
        ctx.fillStyle = '#078878';
        ctx.fillText('Objectif ' + state.objective[criterion.id] + '/10', 1215, y + 65);
      });
      return page.canvas;
    }

    function createSummaryReportPage() {
      const patientValues = criteria.map(c => state.patient[c.id]).filter(Number.isFinite);
      const patientMean = patientValues.length ? average(patientValues) : null;
      const clinicalMean = average(criteria.map(c => state.clinician[c.id]));
      const objectiveMean = average(criteria.map(c => state.objective[c.id]));
      const finalSentence = objectiveMean >= clinicalMean
        ? 'Avec cette solution, l’objectif est de faire passer votre bouche de ' + formatShortScore(clinicalMean) + '/10 à ' + formatShortScore(objectiveMean) + '/10.'
        : 'Avec cette solution, l’objectif clinique évolue de ' + formatShortScore(clinicalMean) + '/10 à ' + formatShortScore(objectiveMean) + '/10.';
      const page = makeReportPage(
        '4 - Synthèse',
        'Votre situation en trois notes',
        'Une lecture simple pour comprendre le point de départ, le ressenti et l’objectif proposé.',
        4
      );
      const ctx = page.ctx;
      const cards = [
        {label: 'Votre ressenti', value: patientMean === null ? '—' : formatScore(patientMean), color: '#1473e6', note: patientValues.length === 6 ? 'Moyenne des 6 critères' : 'Moyenne de ' + patientValues.length + '/6 critères'},
        {label: 'Le constat clinique', value: formatScore(clinicalMean), color: '#101114', note: 'Moyenne des 6 critères'},
        {label: 'L’objectif proposé', value: formatScore(objectiveMean), color: '#078878', note: 'Moyenne des 6 critères projetés'}
      ];
      cards.forEach((card, index) => {
        const x = 80 + index * 490;
        reportRoundRect(ctx, x, 355, 450, 330, 25, index === 2 ? '#eef8f6' : '#ffffff', index === 2 ? '#9cd4ca' : '#e1e2e5');
        ctx.fillStyle = '#6e7178';
        ctx.font = '700 22px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(card.label, x + 225, 420);
        ctx.fillStyle = card.color;
        ctx.font = '700 96px Arial, sans-serif';
        ctx.fillText(card.value, x + 225, 555);
        if (card.value !== '—') {
          ctx.font = '700 25px Arial, sans-serif';
          ctx.fillText('/10', x + 225, 596);
        }
        ctx.fillStyle = '#6e7178';
        ctx.font = '400 17px Arial, sans-serif';
        ctx.fillText(card.note, x + 225, 644);
      });
      ctx.fillStyle = '#101114';
      ctx.font = '700 44px Arial, sans-serif';
      ctx.textAlign = 'left';
      drawWrappedText(ctx, finalSentence, 190, 790, 1220, 53, 3);
      reportRoundRect(ctx, 330, 925, 940, 70, 35, '#101114');
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 20px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Ressenti · Évaluation clinique · Repères de vie · Objectif', 800, 968);
      ctx.textAlign = 'left';
      return page.canvas;
    }

    function textBytes(value) {
      const bytes = new Uint8Array(value.length);
      for (let index = 0; index < value.length; index++) bytes[index] = value.charCodeAt(index) & 255;
      return bytes;
    }

    function joinBytes(parts) {
      const length = parts.reduce((sum, part) => sum + part.length, 0);
      const output = new Uint8Array(length);
      let offset = 0;
      parts.forEach(part => {
        output.set(part, offset);
        offset += part.length;
      });
      return output;
    }

    function jpegBytesFromDataUrl(dataUrl) {
      const binary = atob(dataUrl.split(',')[1]);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }

    function assemblePdfFromJpegs(dataUrls, imageWidth, imageHeight) {
      const pageWidth = 842;
      const pageHeight = 595;
      const maxObject = 2 + dataUrls.length * 3;
      const objects = new Array(maxObject + 1);
      const pageIds = dataUrls.map((_, index) => 3 + index * 3);
      objects[1] = [textBytes('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n')];
      objects[2] = [textBytes('2 0 obj\n<< /Type /Pages /Count ' + dataUrls.length + ' /Kids [' + pageIds.map(id => id + ' 0 R').join(' ') + '] >>\nendobj\n')];
      dataUrls.forEach((dataUrl, index) => {
        const pageId = 3 + index * 3;
        const contentId = pageId + 1;
        const imageId = pageId + 2;
        const imageName = 'Im' + (index + 1);
        const content = textBytes('q\n' + pageWidth + ' 0 0 ' + pageHeight + ' 0 0 cm\n/' + imageName + ' Do\nQ\n');
        const jpeg = jpegBytesFromDataUrl(dataUrl);
        objects[pageId] = [textBytes(pageId + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageWidth + ' ' + pageHeight + '] /Resources << /ProcSet [/PDF /ImageC] /XObject << /' + imageName + ' ' + imageId + ' 0 R >> >> /Contents ' + contentId + ' 0 R >>\nendobj\n')];
        objects[contentId] = [
          textBytes(contentId + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n'),
          content,
          textBytes('endstream\nendobj\n')
        ];
        objects[imageId] = [
          textBytes(imageId + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + imageWidth + ' /Height ' + imageHeight + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n'),
          jpeg,
          textBytes('\nendstream\nendobj\n')
        ];
      });
      const header = new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]);
      const parts = [header];
      const offsets = new Array(maxObject + 1).fill(0);
      let byteLength = header.length;
      for (let id = 1; id <= maxObject; id++) {
        offsets[id] = byteLength;
        objects[id].forEach(part => {
          parts.push(part);
          byteLength += part.length;
        });
      }
      const xrefOffset = byteLength;
      let xref = 'xref\n0 ' + (maxObject + 1) + '\n0000000000 65535 f \n';
      for (let id = 1; id <= maxObject; id++) xref += String(offsets[id]).padStart(10, '0') + ' 00000 n \n';
      xref += 'trailer\n<< /Size ' + (maxObject + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF\n';
      parts.push(textBytes(xref));
      return joinBytes(parts);
    }

    async function generateReportPDF(event) {
      const button = event.currentTarget;
      const status = document.getElementById('reportStatus');
      button.disabled = true;
      button.textContent = 'Création en cours…';
      status.textContent = 'Préparation des quatre pages.';
      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const pages = [
          createComparisonReportPage(),
          createPopulationReportPage(),
          createTreatmentReportPage(),
          createSummaryReportPage()
        ];
        const images = pages.map(canvas => canvas.toDataURL('image/jpeg', .94));
        const pdf = assemblePdfFromJpegs(images, pages[0].width, pages[0].height);
        const blob = new Blob([pdf], {type: 'application/pdf'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const date = new Date().toISOString().slice(0, 10);
        link.href = url;
        link.download = 'rapport-sourireplus-' + date + '.pdf';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 15000);
        status.textContent = 'Rapport téléchargé : 4 pages.';
      } catch (error) {
        status.textContent = 'La création du rapport n’a pas abouti. Réessayez.';
      } finally {
        button.disabled = false;
        button.textContent = 'Générer le rapport PDF';
      }
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => state.phase === 'results' && renderChart(), 120);
    });

    function registerWebMCP() {
      const context = document.modelContext;
      if (!context || typeof context.registerTool !== 'function') return;
      const scoreSchema = { anyOf: [{type:'integer', minimum:0, maximum:10}, {type:'string', enum:['unknown']}] };
      const clinicianScoreSchema = { type:'integer', minimum:0, maximum:10 };
      const scoreProperties = Object.fromEntries(criteria.map(c => [c.id, scoreSchema]));
      const clinicianProperties = Object.fromEntries(criteria.map(c => [c.id, clinicianScoreSchema]));
      const requiredIds = criteria.map(c => c.id);

      try {
        void Promise.resolve(context.registerTool({
          name: 'complete_smile_assessment',
          title: 'Compléter l’évaluation SourirePlus',
          description: 'Renseigne l’âge, les six ressentis du patient, l’évaluation clinique et les six objectifs après traitement, puis affiche les quatre lectures SourirePlus : ressenti, évaluation clinique, repères de vie et objectif.',
          inputSchema: {
            type: 'object',
            properties: {
              age: {type:'integer', minimum:10, maximum:100},
              patient: {type:'object', properties:scoreProperties, required:requiredIds, additionalProperties:false},
              clinician: {type:'object', properties:clinicianProperties, required:requiredIds, additionalProperties:false},
              objective: {type:'object', properties:clinicianProperties, required:requiredIds, additionalProperties:false}
            },
            required: ['age', 'patient', 'clinician', 'objective'],
            additionalProperties: false
          },
          annotations: {readOnlyHint:false, untrustedContentHint:false},
          execute(input) {
            if (!input || !Number.isInteger(input.age) || input.age < 10 || input.age > 100) throw new Error('Âge invalide.');
            for (const c of criteria) {
              const p = input.patient && input.patient[c.id];
              const d = input.clinician && input.clinician[c.id];
              const o = input.objective && input.objective[c.id];
              if (!(p === 'unknown' || (Number.isInteger(p) && p >= 0 && p <= 10))) throw new Error(`Ressenti invalide pour ${c.id}.`);
              if (!(Number.isInteger(d) && d >= 0 && d <= 10)) throw new Error(`Note clinique invalide pour ${c.id}.`);
              if (!(Number.isInteger(o) && o >= 0 && o <= 10)) throw new Error(`Objectif invalide pour ${c.id}.`);
            }
            state.age = input.age;
            state.patient = {...input.patient};
            state.clinician = {...input.clinician};
            state.objective = {...input.objective};
            state.phase = 'results';
            state.resultView = 'comparison';
            state.filter = 'treatment';
            render();
            const numericPatient = criteria.map(c => state.patient[c.id]).filter(Number.isFinite);
            return {
              status:'visuals_ready',
              age:state.age,
              patient_average:numericPatient.length ? average(numericPatient) : null,
              clinical_average:average(criteria.map(c => state.clinician[c.id])),
              objective_average:average(criteria.map(c => state.objective[c.id])),
              unknown_count:criteria.filter(c => state.patient[c.id] === 'unknown').length
            };
          }
        })).catch(() => {});
      } catch (_) {}
    }

    render();
    registerWebMCP();
  </script>
