<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="La Méthode SourirePlus relie votre ressenti, l’évaluation clinique, les repères de vie et l’objectif du traitement.">
  <meta name="robots" content="noindex,nofollow">
  <title>La Méthode SourirePlus — Visite patient</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101114'/%3E%3Cpath d='M18 24c4-8 24-8 28 0M18 39c7 8 21 8 28 0' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23e51a78'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #101114;
      --muted: #686b73;
      --line: #dedfe3;
      --soft: #f4f5f7;
      --paper: #ffffff;
      --blue: #1473e6;
      --red: #e3262e;
      --green: #2ca640;
      --orange: #f5820b;
      --violet: #7137b9;
      --pink: #e51a78;
      --patient: #256fa8;
      --clinical: #101114;
      --objective: #078878;
      --accent: var(--blue);
      --shadow: 0 24px 70px rgba(16, 17, 20, .10);
    }

    .finance-frame {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, .9fr);
      gap: 18px;
      margin-bottom: 24px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #f7f8fa;
    }
    .finance-frame h3 { margin: 0 0 6px; font-size: 1.08rem; }
    .finance-frame p { margin: 0; color: var(--muted); font-size: .88rem; }
    .finance-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
    }
    .finance-field { display: grid; gap: 6px; }
    .finance-field label { color: var(--muted); font-size: .76rem; font-weight: 750; }
    .money-input {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      min-height: 48px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
    }
    .money-input input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 1rem;
    }
    .money-input span { color: var(--muted); font-size: .82rem; font-weight: 750; }
    .finance-rule {
      grid-column: 1 / -1;
      padding-top: 4px;
      color: #555861;
      font-size: .82rem;
    }
    .finance-rule strong { color: var(--ink); }


    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 10%, rgba(20, 115, 230, .08), transparent 28rem),
        radial-gradient(circle at 88% 90%, rgba(229, 26, 120, .07), transparent 30rem),
        #f7f7f8;
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(100% - 28px, 1180px);
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: .13em;
      font-size: .78rem;
      font-weight: 750;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    .top-note {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      font-size: .86rem;
      font-weight: 720;
      letter-spacing: .01em;
    }

    .rainbow {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      width: 100%;
      height: 5px;
      margin-bottom: 18px;
    }

    .rainbow span { border-radius: 999px; opacity: .22; transition: opacity .2s, transform .2s; }
    .rainbow span.active { opacity: 1; transform: scaleY(1.6); }

    .surface {
      overflow: hidden;
      border: 1px solid rgba(16, 17, 20, .09);
      border-radius: 28px;
      background: rgba(255, 255, 255, .96);
      box-shadow: var(--shadow);
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(310px, .85fr);
      min-height: 620px;
    }

    .intro-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(34px, 6vw, 78px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }
    h1 {
      max-width: 800px;
      margin-bottom: 20px;
      font-size: clamp(2.55rem, 7vw, 5.5rem);
      line-height: .94;
      letter-spacing: -.055em;
      font-weight: 680;
    }

    h2 {
      margin-bottom: 12px;
      font-size: clamp(2rem, 4.4vw, 4rem);
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 680;
    }

    .lead {
      max-width: 650px;
      margin-bottom: 30px;
      color: #44474e;
      font-size: clamp(1.05rem, 2vw, 1.24rem);
    }

    .intro-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100%;
      padding: clamp(28px, 5vw, 56px);
      color: white;
      background: var(--ink);
    }

    .orbit {
      position: relative;
      width: min(100%, 330px);
      aspect-ratio: 1;
      margin: 0 auto 34px;
    }

    .orbit::before, .orbit::after {
      content: "";
      position: absolute;
      inset: 15%;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
    }
    .orbit::after { inset: 31%; }

    .orbit-dot {
      --angle: 0deg;
      position: absolute;
      top: 50%; left: 50%;
      width: 46px; height: 46px;
      margin: -23px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--c);
      color: white;
      font-size: 1.25rem;
      font-weight: 800;
      transform: rotate(var(--angle)) translateX(128px) rotate(calc(-1 * var(--angle)));
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }

    .orbit-center {
      position: absolute;
      inset: 38%;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: white;
      color: var(--ink);
      font-size: 1.35rem;
      font-weight: 800;
    }

    .field { display: grid; gap: 8px; margin-top: 14px; }
    .field label { color: rgba(255,255,255,.76); font-size: .92rem; }
    .age-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .age-input {
      min-width: 0;
      height: 54px;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,.09);
      color: white;
      font-size: 1.06rem;
    }
    .age-input:focus { border-color: white; box-shadow: 0 0 0 3px rgba(255,255,255,.14); }

    .btn {
      min-height: 52px;
      padding: 0 22px;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 720;
      transition: transform .16s, background .16s, border-color .16s, opacity .16s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 3px solid rgba(20,115,230,.28); outline-offset: 3px; }
    .btn:disabled { cursor: not-allowed; opacity: .38; transform: none; }
    .btn-primary { background: var(--ink); color: white; }
    .intro-panel .btn-primary { background: white; color: var(--ink); }
    .btn-secondary { border-color: var(--line); background: white; color: var(--ink); }
    .btn-secondary.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, white); color: var(--accent); }
    .btn-ghost { min-height: 44px; padding: 0 14px; background: transparent; color: var(--muted); }

    .fineprint { margin: 16px 0 0; color: rgba(255,255,255,.58); font-size: .84rem; }

    .question {
      display: grid;
      grid-template-columns: minmax(250px, .72fr) minmax(0, 1.28fr);
      min-height: 620px;
    }

    .question-visual {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 5vw, 56px);
      color: white;
      background: var(--accent);
    }

    .question-visual::after {
      content: "";
      position: absolute;
      width: 420px; height: 420px;
      right: -180px; bottom: -180px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      box-shadow: 0 0 0 42px rgba(255,255,255,.04), 0 0 0 88px rgba(255,255,255,.035);
    }

    .step-label { font-size: .82rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
    .big-icon {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 148px; height: 148px;
      margin: auto;
      border: 1px solid rgba(255,255,255,.36);
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      font-size: 4.3rem;
      line-height: 1;
      backdrop-filter: blur(8px);
    }

    .visual-name { position: relative; z-index: 1; margin: 0; font-size: clamp(1.5rem, 3vw, 2.6rem); letter-spacing: -.035em; }

    .question-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(32px, 6vw, 78px);
    }

    .question-copy h2 { max-width: 760px; }
    .detail { max-width: 700px; margin-bottom: 34px; color: var(--muted); font-size: 1.04rem; }

    .score-card {
      padding: clamp(22px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--soft);
    }

    .score-head { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .score-title { margin: 0; color: var(--muted); font-size: .9rem; font-weight: 720; letter-spacing: .05em; text-transform: uppercase; }
    .score-value { min-width: 90px; color: var(--accent); text-align: right; font-size: clamp(2.4rem, 6vw, 4.4rem); line-height: .8; font-weight: 760; letter-spacing: -.06em; }
    .score-value small { font-size: .32em; letter-spacing: 0; }

    .range {
      width: 100%;
      height: 34px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .range:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 25%, transparent); outline-offset: 5px; }
    .range-labels { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font-size: .84rem; }
    .range-labels span:last-child { text-align: right; }

    .question-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .question-actions .right { display: flex; gap: 10px; }

    .handoff {
      min-height: 620px;
      display: grid;
      place-items: center;
      padding: clamp(36px, 8vw, 90px);
      text-align: center;
    }
    .handoff-inner { max-width: 720px; }
    .checkmark {
      width: 84px; height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      font-size: 2rem;
    }
    .handoff h1 { font-size: clamp(2.7rem, 7vw, 5rem); }
    .handoff .lead { margin-inline: auto; }
    .privacy-pill { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 26px; padding: 8px 13px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: .86rem; }

    .results { padding: clamp(24px, 5vw, 56px); }
    .results-head { display: flex; align-items: end; justify-content: space-between; gap: 28px; margin-bottom: 26px; }
    .results-head h1 { margin-bottom: 10px; font-size: clamp(2.6rem, 6vw, 5.2rem); }
    .results-head .lead { margin-bottom: 0; }
    .results-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin: 18px 0;
      color: var(--muted);
      font-size: .88rem;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 8px; }
    .legend-shape { width: 13px; height: 13px; display: inline-block; border: 2px solid var(--ink); background: white; }
    .legend-shape.patient { border-radius: 50%; }
    .legend-shape.clinician { background: var(--ink); transform: rotate(45deg) scale(.78); }
    .legend-shape.objective { border-color: var(--objective); border-radius: 50%; background: var(--objective); }
    .legend-line { width: 26px; border-top: 3px solid #999; opacity: .48; }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 1px 12px;
      scrollbar-width: thin;
    }
    .filter {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--muted);
      cursor: pointer;
      font-size: .88rem;
      font-weight: 700;
    }
    .filter.active { border-color: var(--ink); background: var(--ink); color: white; }

    .chart-card {
      overflow: hidden;
      padding: 18px 12px 8px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: white;
    }
    .chart-titles { display: flex; justify-content: space-between; gap: 16px; padding: 0 12px 6px; color: var(--muted); font-size: .76rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    #chart { display: block; width: 100%; height: 460px; }
    .chart-note { margin: 10px 12px 8px; color: var(--muted); font-size: .82rem; }

    .population-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.38fr) minmax(300px, .62fr);
      gap: 18px;
      align-items: start;
    }

    .population-story {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--ink);
      color: white;
    }

    .population-story h3 { margin: 0 0 7px; font-size: 1.15rem; }
    .population-story > p { margin: 0 0 18px; color: #c9cbd1; font-size: .9rem; }
    .population-facts { display: grid; gap: 10px; }
    .population-fact {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 13px;
      align-items: start;
      padding: 13px;
      border-radius: 15px;
      background: rgba(255,255,255,.08);
    }
    .fact-value {
      color: var(--c);
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.04em;
    }
    .fact-value small { font-size: .55em; letter-spacing: 0; }
    .fact-copy { margin: 0; color: #ececef; font-size: .86rem; line-height: 1.42; }
    .fact-copy strong { color: white; }
    .population-key {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      padding: 12px 13px;
      border-radius: 14px;
      background: #f2f3f5;
      color: #555861;
      font-size: .84rem;
    }
    .population-key strong { color: var(--ink); }

    .summary-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; margin-top: 18px; }
    .panel { padding: 22px; border: 1px solid var(--line); border-radius: 22px; background: white; }
    .panel h3 { margin: 0 0 16px; font-size: 1.05rem; }
    .score-list { display: grid; gap: 8px; }
    .score-row {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) 110px 120px 92px;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 7px 10px;
      border-radius: 13px;
      background: var(--soft);
    }
    .criterion-label { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 720; }
    .color-dot { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; background: var(--c); }
    .value-pill { white-space: nowrap; color: var(--muted); font-size: .9rem; }
    .value-pill strong { color: var(--ink); font-size: 1.05rem; }
    .gap { justify-self: end; white-space: nowrap; color: var(--muted); font-size: .83rem; }
    .gap.large { color: #9b3f00; font-weight: 760; }

    .discussion { display: grid; gap: 13px; }
    .discussion-item { padding: 14px 15px; border-left: 4px solid var(--c, var(--ink)); border-radius: 8px 13px 13px 8px; background: var(--soft); }
    .discussion-item strong { display: block; margin-bottom: 3px; }
    .discussion-item span { color: var(--muted); font-size: .9rem; }
    .empty-discussion { color: var(--muted); }

    .scale-warning {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      padding: 15px 17px;
      border-radius: 16px;
      background: #f2f3f5;
      color: #555861;
      font-size: .88rem;
    }
    .scale-warning strong { color: var(--ink); }

    .result-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 28px;
    }

    .result-tab {
      min-height: 54px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      color: var(--muted);
      cursor: pointer;
      font-weight: 720;
    }

    .result-tab.active {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }

    .result-stage { min-height: 510px; }

    .stage-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 22px;
    }

    .stage-head h2 { margin-bottom: 8px; font-size: clamp(2rem, 4vw, 3.5rem); }
    .stage-head p { max-width: 720px; margin-bottom: 0; color: var(--muted); font-size: 1.02rem; }
    .stage-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

    .method-signature {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      color: var(--ink);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .method-signature::before {
      content: "S+";
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      letter-spacing: 0;
    }

    .visual-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(260px, .55fr);
      gap: 18px;
      align-items: start;
    }

    .comparison-list {
      display: grid;
      gap: 8px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: white;
    }

    .comparison-row {
      display: grid;
      grid-template-columns: minmax(145px, .7fr) minmax(180px, 1.3fr) 148px;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 8px 10px;
      border-radius: 14px;
      background: var(--soft);
    }

    .score-track {
      position: relative;
      height: 32px;
      margin: 0 10px;
    }

    .score-track::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 15px;
      height: 3px;
      border-radius: 999px;
      background: #d9dbe0;
    }

    .score-track::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 10px;
      width: 1px;
      height: 13px;
      background: #b9bbc1;
    }

    .track-marker {
      position: absolute;
      left: calc(var(--score) * 10%);
      z-index: 1;
      width: 14px;
      height: 14px;
      transform: translateX(-50%);
    }

    .track-marker.patient {
      top: 2px;
      border: 3px solid var(--patient);
      border-radius: 50%;
      background: white;
    }

    .track-marker.clinical {
      bottom: 1px;
      background: var(--clinical);
      transform: translateX(-50%) rotate(45deg) scale(.8);
    }

    .track-marker.objective {
      bottom: 1px;
      border-radius: 50%;
      background: var(--objective);
      box-shadow: 0 0 0 2px white;
    }

    .comparison-values {
      color: var(--muted);
      font-size: .88rem;
      text-align: right;
      white-space: nowrap;
    }

    .comparison-values strong { color: var(--ink); }

    .life-strip {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 18px;
    }

    .life-stage {
      min-height: 64px;
      padding: 10px 8px;
      border-radius: 13px;
      background: var(--soft);
      color: var(--muted);
      text-align: center;
    }

    .life-stage strong { display: block; color: inherit; }
    .life-stage span { font-size: .78rem; }
    .life-stage.active { background: var(--ink); color: white; }

    .impact-line {
      position: absolute;
      left: calc(var(--from) * 10%);
      top: 14px;

<body>
  <div class="shell">

  <script>
    const criteria = [
      {
        id: 'alignement', name: 'Alignement', color: '#1473e6', icon: '↔',

      {

        detail: 'Répondez avec ce que vous savez ou ressentez. « Je ne sais pas » est aussi une réponse utile.',

        action: 'la qualité de vos restaurations',
        prompt: 'Dans quel état vous semblent vos dents déjà soignées ?',
        detail: 'Cela concerne notamment les composites, couronnes, bridges et implants.',
        clinical: 'Entretien, réparation, remplacement et réhabilitation.'
      },
      {
        id: 'fonction', name: 'Fonction & confort', color: '#7137b9', icon: '⌁',
        action: 'la fonction et le confort de votre bouche',
        prompt: 'Votre bouche vous paraît-elle confortable et efficace au quotidien ?',
        detail: 'Pensez à la mastication, au serrage, à l’usure, aux douleurs et aux gênes.',
        clinical: 'Occlusion, mastication, usure, bruxisme, douleurs et confort.'
      },
      {
        id: 'esthetique', name: 'Esthétique', color: '#e51a78', icon: '✦',
        action: 'l’esthétique de votre sourire',

        detail: 'Pensez à la couleur, à la forme et à l’harmonie générale.',
        clinical: 'Couleur, forme et harmonie du sourire.'

    ];

    const referenceSeries = [
      { id:'alignement', points:[[10,30],[15,50],[20,25],[30,5],[41,11],[50,25],[60,35],[65,40],[70,48],[80,60]] },
      { id:'caries', points:[[10,35],[15,30],[20,15],[29,11],[39,41],[50,23],[60,26],[66,30],[73,39],[80,76]] },
      { id:'gencives', points:[[10,5],[15,8],[22,11],[29,25],[38,18],[50,32],[60,59],[66,68],[74,76],[80,82]] },
      { id:'restaurations', points:[[10,2],[15,5],[22,8],[32,11],[40,32],[48,28],[56,51],[62,67],[70,80],[80,88]] },
      { id:'fonction', points:[[10,25],[15,48],[20,30],[30,12],[40,18],[50,30],[60,35],[65,40],[70,62],[80,82]] },
      { id:'esthetique', points:[[10,10],[15,35],[20,52],[30,45],[38,25],[50,65],[60,65],[68,59],[75,48],[80,19]] }
    ];

    const state = {
      phase: 'intro',
      role: 'patient',
      index: 0,
      age: null,
      answer: null,
      patient: {},
      clinician: {},
      objective: {},
      finance: {immediate:null, monthly:null},
      quotes: [
        {id:'q1', title:'Devis Essentiels', category:'essential', window:'Maintenant', amount:null},
        {id:'q2', title:'Devis Besoins patient', category:'needs', window:'3 à 12 mois', amount:null},
        {id:'q3', title:'Proposition stratégique', category:'strategic', window:'12 à 36 mois', amount:null}

      trajectory: {},
      resultView: 'comparison',
      filter: 'treatment'

    const app = document.getElementById('app');
    const rainbow = document.getElementById('rainbow');
    const colorById = Object.fromEntries(criteria.map(c => [c.id, c.color]));

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function setRainbow(activeIndex = -1) {
      rainbow.innerHTML = criteria.map((c, i) => `<span class="${i === activeIndex ? 'active' : ''}" style="background:${c.color}"></span>`).join('');
    }

    function resetAll() {
      state.phase = 'intro';
      state.role = 'patient';
      state.index = 0;
      state.age = null;
      state.answer = null;
      state.patient = {};
      state.clinician = {};
      state.objective = {};
      state.finance = {immediate:null, monthly:null};
      state.quotes = [
        {id:'q1', title:'Devis Essentiels', category:'essential', window:'Maintenant', amount:null},
        {id:'q2', title:'Devis Besoins patient', category:'needs', window:'3 à 12 mois', amount:null},
        {id:'q3', title:'Proposition stratégique', category:'strategic', window:'12 à 36 mois', amount:null}
      ];
      state.trajectory = {};
      state.resultView = 'comparison';
      state.filter = 'treatment';
      render();
    }

    document.getElementById('brandLink').addEventListener('click', (event) => {
      event.preventDefault();
      if (state.phase === 'intro' || confirm('Revenir au début et effacer les réponses de cette session ?')) resetAll();
    });

    function render() {
      window.scrollTo({top: 0, behavior: 'smooth'});
      if (state.phase === 'intro') renderIntro();
      else if (state.phase === 'question') renderQuestion();
      else if (state.phase === 'handoff') renderHandoff();
      else if (state.phase === 'projection') renderProjectionHandoff();
      else if (state.phase === 'plan') renderTreatmentPlan();
      else renderResults();
    }

    function renderIntro() {
      setRainbow();
      app.innerHTML = `
        <section class="intro">
          <div class="intro-copy">
            <p class="eyebrow">Votre parcours en quatre temps · environ 2 minutes</p>
            <h1>Commençons par votre ressenti.</h1>
            <p class="lead">Avant le scan, les radios et l’examen, nous souhaitons savoir comment vous percevez votre bouche aujourd’hui. Il n’y a ni bonne ni mauvaise réponse.</p>
            <p style="color:var(--muted);margin:0"><strong>Pour chaque critère, 0 décrit une situation très mauvaise et 10 une situation excellente.</strong> Si vous hésitez, choisissez « Je ne sais pas ».</p>
          </div>
          <div class="intro-panel">
            <div class="orbit" aria-hidden="true">
              ${criteria.map((c,i) => `<span class="orbit-dot" style="--angle:${i*60}deg;--c:${c.color}">${c.icon}</span>`).join('')}
              <span class="orbit-center">6</span>
            </div>
            <form id="startForm" class="field">
              <label for="age">Votre âge</label>
              <div class="age-row">

                <button class="btn btn-primary" type="submit">Commencer</button>
              </div>
              <p class="fineprint">Votre âge permettra ensuite de situer la solution proposée dans les repères SourirePlus. Vos réponses ouvrent le dialogue ; seul l’examen établit le constat clinique.</p>
            </form>
          </div>
        </section>`;
      document.getElementById('startForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const age = Number(document.getElementById('age').value);
        if (!Number.isFinite(age) || age < 10 || age > 100) {
          document.getElementById('age').setCustomValidity('Indiquez un âge entre 10 et 100 ans.');
          document.getElementById('age').reportValidity();
          return;
        }
        state.age = age;
        state.phase = 'question';
        state.role = 'patient';
        state.index = 0;
        state.answer = null;
        render();
      });
      document.getElementById('age').addEventListener('input', event => event.target.setCustomValidity(''));
    }

    function renderQuestion() {

function quoteCategoryLabel(category) {
  return ({essential:'Essentiels', needs:'Besoins patient', strategic:'Proposition stratégique'})[category] || 'Étape';
}
function moneyValue(value) {
  const number = Number(value);
  return Number.isFinite(number) && number >= 0 ? number : null;
}
function moneyLabel(value) {
  const number = moneyValue(value);
  if (number === null) return '—';
  return Math.round(number).toLocaleString('fr-CH') + ' CHF';
}
function therapeuticWindowBounds(label) {
  const windows = {
    'Maintenant':[0,1],
    '0 à 3 mois':[0,3],
    '3 à 6 mois':[3,6],
    '3 à 12 mois':[3,12],
    '6 à 18 mois':[6,18],
    '12 à 24 mois':[12,24],
    '12 à 36 mois':[12,36],
    '2 à 4 ans':[24,48],
    'À réévaluer':[null,null]
  };
  return windows[label] || [null,null];
}
function financialSchedule() {
  const immediate = moneyValue(state.finance.immediate);
  const monthly = moneyValue(state.finance.monthly);
  let previousTotal = 0;
  return state.quotes.map(quote => {
    const amount = moneyValue(quote.amount);
    if (amount === null || amount <= 0 || immediate === null) {
      previousTotal += amount || 0;
      return {month:null, threshold:null, amount};
    }
    const threshold = previousTotal + amount * .5;
    let month = null;
    if (immediate >= threshold) month = 0;
    else if (monthly !== null && monthly > 0) month = Math.ceil((threshold - immediate) / monthly);
    previousTotal += amount;
    return {month, threshold, amount};
  });
}
function monthLabel(month) {
  if (month === null || month === undefined) return 'à calculer';
  if (month <= 0) return 'dès maintenant';
  if (month === 1) return 'dès 1 mois';
  return 'dès ' + month + ' mois';
}
function combinedWindow(quote, financialMonth) {
  const bounds = therapeuticWindowBounds(quote.window);
  const min = bounds[0];
  const max = bounds[1];
  if (min === null && max === null) return {label:'à réévaluer', warning:false};
  if (financialMonth === null || financialMonth === undefined) return {label:quote.window, warning:false};
  const start = Math.max(min || 0, financialMonth);
  if (max !== null && start > max) return {label:'à réévaluer : financement après la fenêtre clinique', warning:true};
  if (max === null) return {label:monthLabel(start), warning:false};
  if (start === max) return {label:'vers ' + start + ' mois', warning:false};
  if (start <= 0 && max <= 1) return {label:'maintenant', warning:false};
  return {label:start + ' à ' + max + ' mois', warning:false};
}

function treatmentTimeline() {
  ensureTrajectory(false);
  const finance = financialSchedule();
  return state.quotes.map((quote, index) => {
    const bounds = therapeuticWindowBounds(quote.window);
    const clinicalStart = bounds[0];
    const financialMonth = finance[index] ? finance[index].month : null;
    let month = null;
    if (clinicalStart !== null && financialMonth !== null && financialMonth !== undefined) month = Math.max(clinicalStart, financialMonth);
    else if (clinicalStart !== null) month = clinicalStart;
    else if (financialMonth !== null && financialMonth !== undefined) month = financialMonth;
    const age = month === null ? null : state.age + month / 12;
    const changedCriteria = criteria.filter(criterion => {
      const values = state.trajectory[criterion.id] || [];
      return values[index + 1] !== values[index];
    });
    return {stage:index + 1, quote, month, age, color:stageCategoryColor(index + 1), changedCriteria};
  });
}

function formatTreatmentAge(age) {
  if (!Number.isFinite(age)) return 'âge à réévaluer';
  const rounded = Math.round(age * 10) / 10;
  return (Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1).replace('.', ',')) + ' ans';
}

function treatmentAgeFacts() {
  return treatmentTimeline().map(item =>
    '<article class="population-fact" style="--c:' + item.color + '">' +
      '<div class="fact-value">' + (Number.isFinite(item.age) ? formatTreatmentAge(item.age).replace(' ans','') + '<small> ans</small>' : '—') + '</div>' +
      '<p class="fact-copy"><strong>Étape ' + item.stage + ' · ' + escapeHtml(item.quote.title || quoteCategoryLabel(item.quote.category)) + '</strong>' +
      (Number.isFinite(item.age) ? ' Positionnée vers ' + escapeHtml(formatTreatmentAge(item.age)) + ' selon la fenêtre thérapeutique actuelle.' : ' Cette étape reste à repositionner dans le temps.') +
      '</p></article>'
  ).join('');
}

function clampTreatmentScore(value) {
  return Math.max(0, Math.min(10, Math.round(Number(value) || 0)));
}

function ensureTrajectory(force) {
  const count = Math.max(1, state.quotes.length);
  criteria.forEach(criterion => {
    const start = clampTreatmentScore(state.clinician[criterion.id]);
    const end = clampTreatmentScore(state.objective[criterion.id]);
    const existing = state.trajectory[criterion.id];
    if (force || !Array.isArray(existing) || existing.length !== count + 1) {
      state.trajectory[criterion.id] = Array.from({length: count + 1}, (_, index) => {
        if (index === 0) return start;
        if (index === count) return end;
        return clampTreatmentScore(start + (end - start) * index / count);
      });
    } else {
      existing[0] = start;
      existing[count] = end;
    }
  });
}

function resampleTrajectory(oldCount, newCount) {
  criteria.forEach(criterion => {
    const start = clampTreatmentScore(state.clinician[criterion.id]);
    const end = clampTreatmentScore(state.objective[criterion.id]);
    const oldValues = Array.isArray(state.trajectory[criterion.id]) && state.trajectory[criterion.id].length === oldCount + 1
      ? state.trajectory[criterion.id].slice()
      : [start, end];
    const sourceCount = Math.max(1, oldValues.length - 1);
    const values = Array.from({length: newCount + 1}, (_, index) => {
      if (index === 0) return start;
      if (index === newCount) return end;
      const position = (index / newCount) * sourceCount;
      const lower = Math.floor(position);
      const upper = Math.min(sourceCount, Math.ceil(position));
      const ratio = position - lower;
      return clampTreatmentScore(oldValues[lower] + (oldValues[upper] - oldValues[lower]) * ratio);
    });
    state.trajectory[criterion.id] = values;
  });
}

function trajectoryScale(criterionId) {
  ensureTrajectory(false);
  const start = Number(state.clinician[criterionId]);
  const end = Number(state.objective[criterionId]);
  let low = Math.min(start, end);
  let high = Math.max(start, end);
  const rawRange = high - low;
  const padding = rawRange < 1 ? 1 : Math.max(.5, rawRange * .15);
  low = Math.max(0, low - padding);
  high = Math.min(10, high + padding);
  if (high - low < 2) {
    const mid = (high + low) / 2;
    low = Math.max(0, mid - 1);
    high = Math.min(10, mid + 1);
  }
  return {low, high};
}

function trajectoryCoordinates(criterionId) {
  ensureTrajectory(false);
  const values = state.trajectory[criterionId];
  const scale = trajectoryScale(criterionId);
  const width = 900;
  const height = 150;
  const left = 42;
  const right = 30;
  const top = 18;
  const bottom = 24;
  const usableW = width - left - right;
  const usableH = height - top - bottom;
  return values.map((value, index) => ({
    x: left + (index / Math.max(1, values.length - 1)) * usableW,
    y: top + ((scale.high - value) / Math.max(.001, scale.high - scale.low)) * usableH,
    value
  }));
}

function trajectoryPath(criterionId) {
  const points = trajectoryCoordinates(criterionId);
  return smoothPath(points.map(point => [point.x, point.y]));
}

function smoothObjectSegment(points, index) {
  const p0 = points[index - 1] || points[index];
  const p1 = points[index];
  const p2 = points[index + 1];
  const p3 = points[index + 2] || p2;
  const cp1x = p1.x + (p2.x - p0.x) / 6;
  const cp1y = p1.y + (p2.y - p0.y) / 6;
  const cp2x = p2.x - (p3.x - p1.x) / 6;
  const cp2y = p2.y - (p3.y - p1.y) / 6;
  return 'M ' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) +
    ' C ' + cp1x.toFixed(1) + ' ' + cp1y.toFixed(1) + ', ' +
    cp2x.toFixed(1) + ' ' + cp2y.toFixed(1) + ', ' +
    p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
}

function scoreTick(value) {
  return Math.round(value * 10) / 10;
}

function trajectorySvgMarkup(criterion, editable) {
  const points = trajectoryCoordinates(criterion.id);
  const scale = trajectoryScale(criterion.id);
  const ticks = [scale.low, (scale.low + scale.high) / 2, scale.high].map(scoreTick);
  const grid = ticks.map(value => {
    const y = 18 + ((scale.high - value) / Math.max(.001, scale.high - scale.low)) * 108;
    return '<line x1="42" y1="' + y + '" x2="870" y2="' + y + '" stroke="#e6e7ea" stroke-width="1"/><text x="31" y="' + (y + 4) + '" text-anchor="end" fill="#8a8d94" font-size="10">' + value + '</text>';
  }).join('');
  const verticals = points.map(point => '<line x1="' + point.x + '" y1="18" x2="' + point.x + '" y2="126" stroke="#f0f1f3" stroke-width="1"/>').join('');
  const handles = points.map((point, index) => {
    const fixed = index === 0 || index === points.length - 1;
    const radius = fixed ? 8 : (editable ? 11 : 8);
    const klass = editable && !fixed ? 'trajectory-handle' : '';
    const attrs = editable && !fixed
      ? ' tabindex="0" role="slider" aria-valuemin="' + Math.min(state.clinician[criterion.id], state.objective[criterion.id]) + '" aria-valuemax="' + Math.max(state.clinician[criterion.id], state.objective[criterion.id]) + '" aria-valuenow="' + point.value + '" data-criterion="' + criterion.id + '" data-stage="' + index + '"'
      : '';
    const fill = index === 0 ? '#101114' : (index === points.length - 1 ? '#078878' : criterion.color);
    return '<g><circle id="handle-' + criterion.id + '-' + index + '" class="' + klass + '" cx="' + point.x + '" cy="' + point.y + '" r="' + radius + '" fill="' + fill + '" stroke="white" stroke-width="4"' + attrs + '></circle><text id="value-' + criterion.id + '-' + index + '" x="' + point.x + '" y="' + Math.max(13, point.y - 15) + '" text-anchor="middle" fill="' + fill + '" font-size="12" font-weight="800">' + point.value + '</text></g>';
  }).join('');
  return grid + verticals + '<path id="path-' + criterion.id + '" d="' + trajectoryPath(criterion.id) + '" fill="none" stroke="' + criterion.color + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".84"/>' + handles;
}

function generalTrajectoryValues() {
  ensureTrajectory(false);
  return Array.from({length: state.quotes.length + 1}, (_, stage) =>
    average(criteria.map(criterion => state.trajectory[criterion.id][stage]))
  );
}

function stageCategoryColor(index) {
  if (index === 0) return '#101114';
  const quote = state.quotes[index - 1];
  if (!quote) return '#078878';
  return quote.category === 'essential' ? '#e3262e' : quote.category === 'needs' ? '#1473e6' : '#7137b9';
}

function generalTrajectorySvgMarkup() {
  const values = generalTrajectoryValues();
  let low = Math.min(...values);
  let high = Math.max(...values);
  const rawRange = high - low;
  const padding = rawRange < 1 ? 1 : Math.max(.5, rawRange * .18);
  low = Math.max(0, low - padding);
  high = Math.min(10, high + padding);
  if (high - low < 2) { const mid=(high+low)/2; low=Math.max(0,mid-1); high=Math.min(10,mid+1); }
  const left=48, right=32, top=22, bottom=30, width=900, height=220;
  const usableW=width-left-right, usableH=height-top-bottom;
  const pts=values.map((value,index)=>({x:left+(index/Math.max(1,values.length-1))*usableW,y:top+((high-value)/Math.max(.001,high-low))*usableH,value}));
  const ticks=[low,(low+high)/2,high].map(scoreTick);
  const grid=ticks.map(value=>{const y=top+((high-value)/Math.max(.001,high-low))*usableH;return '<line x1="'+left+'" y1="'+y+'" x2="'+(width-right)+'" y2="'+y+'" stroke="#e5e7ea" stroke-width="1"/><text x="'+(left-10)+'" y="'+(y+4)+'" text-anchor="end" fill="#8a8d94" font-size="11">'+value+'</text>';}).join('');
  const verticals=pts.map(p=>'<line x1="'+p.x+'" y1="'+top+'" x2="'+p.x+'" y2="'+(height-bottom)+'" stroke="#f0f1f3" stroke-width="1"/>').join('');
  const segments=pts.slice(0,-1).map((p,index)=>
    '<path d="'+smoothObjectSegment(pts,index)+'" fill="none" stroke="'+stageCategoryColor(index+1)+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>'
  ).join('');
  const marks=pts.map((p,index)=>'<g><circle cx="'+p.x+'" cy="'+p.y+'" r="10" fill="'+stageCategoryColor(index)+'" stroke="white" stroke-width="3"></circle><text x="'+p.x+'" y="'+Math.max(14,p.y-17)+'" text-anchor="middle" fill="'+stageCategoryColor(index)+'" font-size="14" font-weight="800">'+formatShortScore(p.value)+'</text></g>').join('');
  return grid+verticals+segments+marks;
}

function updateTrajectoryDom(criterionId) {
  const criterion = criteria.find(item => item.id === criterionId);
  const row = document.querySelector('[data-trajectory-row="' + criterionId + '"]');
  if (!criterion || !row) return;
  const points = trajectoryCoordinates(criterionId);
  const path = row.querySelector('#path-' + criterionId);
  if (path) path.setAttribute('d', trajectoryPath(criterionId));
  points.forEach((point, index) => {
    const handle = row.querySelector('#handle-' + criterionId + '-' + index);
    const value = row.querySelector('#value-' + criterionId + '-' + index);
    if (handle) {
      handle.setAttribute('cy', point.y);
      if (index > 0) handle.setAttribute('aria-valuenow', point.value);
    }
    if (value) {
      value.setAttribute('y', Math.max(13, point.y - 15));
      value.textContent = point.value;
    }
  });
  const meta = row.querySelector('.trajectory-row-meta');
  const values = state.trajectory[criterionId];
  if (meta) meta.textContent = 'Aujourd’hui ' + values[0] + '/10 · Final ' + values[values.length - 1] + '/10';
  refreshPlanGlobalScores();
}

function setTrajectoryPoint(criterionId, stage, score) {
  ensureTrajectory(false);
  const values = state.trajectory[criterionId];
  if (!values || stage <= 0 || stage >= values.length - 1) return;
  const low = Math.min(state.clinician[criterionId], state.objective[criterionId]);
  const high = Math.max(state.clinician[criterionId], state.objective[criterionId]);
  values[stage] = Math.max(low, Math.min(high, clampTreatmentScore(score)));
  updateTrajectoryDom(criterionId);
}

function bindTreatmentPlan() {
  const immediate = document.getElementById('financeImmediate');
  const monthly = document.getElementById('financeMonthly');
  if (immediate) immediate.addEventListener('change', event => {
    state.finance.immediate = event.target.value === '' ? null : Math.max(0, Number(event.target.value));
    renderTreatmentPlan();
  });
  if (monthly) monthly.addEventListener('change', event => {
    state.finance.monthly = event.target.value === '' ? null : Math.max(0, Number(event.target.value));
    renderTreatmentPlan();
  });
  document.querySelectorAll('[data-quote-title]').forEach(input => input.addEventListener('input', event => {
    state.quotes[Number(event.target.dataset.quoteTitle)].title = event.target.value;
  }));
  document.querySelectorAll('[data-quote-amount]').forEach(input => input.addEventListener('change', event => {
    state.quotes[Number(event.target.dataset.quoteAmount)].amount = event.target.value === '' ? null : Math.max(0, Number(event.target.value));
    renderTreatmentPlan();
  }));
  document.querySelectorAll('[data-quote-category]').forEach(select => select.addEventListener('change', event => {
    state.quotes[Number(event.target.dataset.quoteCategory)].category = event.target.value;
    renderTreatmentPlan();
  }));
  document.querySelectorAll('[data-quote-window]').forEach(input => input.addEventListener('change', event => {
    state.quotes[Number(event.target.dataset.quoteWindow)].window = event.target.value;
    renderTreatmentPlan();
  }));
  document.querySelectorAll('[data-remove-quote]').forEach(button => button.addEventListener('click', event => {
    if (state.quotes.length <= 1) return;
    const oldCount = state.quotes.length;
    state.quotes.splice(Number(event.currentTarget.dataset.removeQuote), 1);
    resampleTrajectory(oldCount, state.quotes.length);
    renderTreatmentPlan();
  }));
  document.getElementById('addQuoteBtn').addEventListener('click', () => {
    const oldCount = state.quotes.length;
    const next = oldCount + 1;
    state.quotes.push({id:'q' + Date.now(), title:'Devis ' + next, category:'strategic', window:'À réévaluer', amount:null});
    resampleTrajectory(oldCount, state.quotes.length);
    renderTreatmentPlan();
  });
  document.getElementById('resetTrajectoryBtn').addEventListener('click', () => {
    ensureTrajectory(true);
    renderTreatmentPlan();
  });
  document.querySelectorAll('.trajectory-handle').forEach(handle => {
    handle.addEventListener('pointerdown', event => {
      const svg = event.currentTarget.closest('svg');
      const criterionId = event.currentTarget.dataset.criterion;
      const stage = Number(event.currentTarget.dataset.stage);
      event.currentTarget.setPointerCapture(event.pointerId);
      const move = moveEvent => {
        const rect = svg.getBoundingClientRect();
        const localY = ((moveEvent.clientY - rect.top) / Math.max(1, rect.height)) * 150;
        const scale = trajectoryScale(criterionId);
        const ratio = Math.max(0, Math.min(1, (localY - 18) / 108));
        const score = scale.high - ratio * (scale.high - scale.low);
        setTrajectoryPoint(criterionId, stage, score);
      };
      const stop = stopEvent => {
        try { event.currentTarget.releasePointerCapture(stopEvent.pointerId); } catch (_) {}
        event.currentTarget.removeEventListener('pointermove', move);
        event.currentTarget.removeEventListener('pointerup', stop);
        event.currentTarget.removeEventListener('pointercancel', stop);
      };
      event.currentTarget.addEventListener('pointermove', move);
      event.currentTarget.addEventListener('pointerup', stop);
      event.currentTarget.addEventListener('pointercancel', stop);
    });
    handle.addEventListener('keydown', event => {
      if (!['ArrowUp','ArrowDown','Home','End'].includes(event.key)) return;
      event.preventDefault();
      const criterionId = event.currentTarget.dataset.criterion;
      const stage = Number(event.currentTarget.dataset.stage);
      const current = state.trajectory[criterionId][stage];
      const low = Math.min(state.clinician[criterionId], state.objective[criterionId]);
      const high = Math.max(state.clinician[criterionId], state.objective[criterionId]);
      const next = event.key === 'ArrowUp' ? current + 1 : event.key === 'ArrowDown' ? current - 1 : event.key === 'Home' ? low : high;
      setTrajectoryPoint(criterionId, stage, next);
    });
  });
  document.getElementById('finishPlanBtn').addEventListener('click', () => {
    state.phase = 'results';
    state.resultView = 'comparison';
    state.filter = 'treatment';
    render();
  });
}

function ageXValue(age, scale, xMax) {
      return scale(Math.min(age, xMax));
    }

    function interpolateSeries(points, age) {
      if (age < points[0][0] || age > points[points.length - 1][0]) return null;
      for (let index = 0; index < points.length - 1; index++) {
        const current = points[index];
        const next = points[index + 1];
        if (age >= current[0] && age <= next[0]) {
          const ratio = (age - current[0]) / (next[0] - current[0]);
          return current[1] + (next[1] - current[1]) * ratio;
        }
      }
      return points[points.length - 1][1];
    }

    function smoothPath(points) {
      if (!points.length) return '';
      if (points.length === 1) return `M ${points[0][0]} ${points[0][1]}`;
      let d = `M ${points[0][0]} ${points[0][1]}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;
        const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
        const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
        const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
        const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2[0]} ${p2[1]}`;
      }
      return d;
    }

    function reportRoundRect(ctx, x, y, width, height, radius, fill, stroke) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      const words = String(text).split(/\s+/);
      const lines = [];
      let line = '';
      const limit = maxLines || 99;
      words.forEach(word => {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      const visible = lines.slice(0, limit);
      visible.forEach((item, index) => {
        let value = item;
        if (index === limit - 1 && lines.length > limit) {
          while (ctx.measureText(value + '...').width > maxWidth && value.length) value = value.slice(0, -1);
          value += '...';
        }
        ctx.fillText(value, x, y + index * lineHeight);
      });
      return y + visible.length * lineHeight;
    }

    function drawReportTrack(ctx, x, y, width, patient, clinical, objective) {
      ctx.strokeStyle = '#d4d6da';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + width, y);
      ctx.stroke();
      ctx.fillStyle = '#8a8d93';
      ctx.font = '400 15px Arial, sans-serif';
      ctx.fillText('0', x - 4, y + 29);
      ctx.textAlign = 'right';
      ctx.fillText('10', x + width + 8, y + 29);
      ctx.textAlign = 'left';
      if (typeof patient === 'number') {
        const px = x + width * patient / 10;
        ctx.beginPath();
        ctx.arc(px, y - 11, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#1473e6';
        ctx.lineWidth = 5;
        ctx.stroke();
      }
      if (typeof clinical === 'number') {
        const cx = x + width * clinical / 10;
        ctx.save();
        ctx.translate(cx, y + 12);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = '#101114';
        ctx.fillRect(-8, -8, 16, 16);
        ctx.restore();
      }
      if (typeof objective === 'number') {
        const ox = x + width * objective / 10;
        ctx.beginPath();
        ctx.arc(ox, y - 11, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#078878';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }

          ctx.fillText(String(values[pointIndex]), point.x, Math.max(y + 17, point.y - 13));

        ctx.textAlign = 'left';
      });
      const labelY = 985;
      ctx.font = '700 14px Arial, sans-serif';
      ctx.fillStyle = '#101114';
      ctx.textAlign = 'center';
      ctx.fillText('Aujourd’hui', xStart, labelY);
      state.quotes.forEach((quote, index) => {
        const x = xStart + ((index + 1) / count) * (xEnd - xStart);
        ctx.fillStyle = '#101114';
        ctx.font = '700 13px Arial, sans-serif';
        ctx.fillText('Étape ' + (index + 1), x, labelY - 12);
        ctx.fillStyle = '#6e7178';
        ctx.font = '400 12px Arial, sans-serif';
        ctx.fillText((quote.window || 'À définir').slice(0, 18), x, labelY + 10);
      });
      ctx.textAlign = 'left';
      return page.canvas;
    }

    function createSummaryReportPage() {
      const patientValues = criteria.map(c => state.patient[c.id]).filter(Number.isFinite);
      const patientMean = patientValues.length ? average(patientValues) : null;
      const clinicalMean = average(criteria.map(c => state.clinician[c.id]));
      const objectiveMean = average(criteria.map(c => state.objective[c.id]));
      const finalSentence = objectiveMean >= clinicalMean
        ? 'Avec cette solution, l’objectif est de faire passer votre bouche de ' + formatShortScore(clinicalMean) + '/10 à ' + formatShortScore(objectiveMean) + '/10.'
        : 'Avec cette solution, l’objectif clinique évolue de ' + formatShortScore(clinicalMean) + '/10 à ' + formatShortScore(objectiveMean) + '/10.';
      const page = makeReportPage(
        '5 - Synthèse',
        'Votre situation en trois notes',
        'Une lecture simple pour comprendre le point de départ, le ressenti et l’objectif proposé.',
        5
      );
      const ctx = page.ctx;
      const cards = [
        {label: 'Votre ressenti', value: patientMean === null ? '—' : formatScore(patientMean), color: '#1473e6', note: patientValues.length === 6 ? 'Moyenne des 6 critères' : 'Moyenne de ' + patientValues.length + '/6 critères'},
        {label: 'Le constat clinique', value: formatScore(clinicalMean), color: '#101114', note: 'Moyenne des 6 critères'},
        {label: 'L’objectif proposé', value: formatScore(objectiveMean), color: '#078878', note: 'Moyenne des 6 critères projetés'}
      ];
      cards.forEach((card, index) => {
        const x = 80 + index * 490;
        reportRoundRect(ctx, x, 355, 450, 330, 25, index === 2 ? '#eef8f6' : '#ffffff', index === 2 ? '#9cd4ca' : '#e1e2e5');
        ctx.fillStyle = '#6e7178';
        ctx.font = '700 22px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(card.label, x + 225, 420);
        ctx.fillStyle = card.color;
        ctx.font = '700 96px Arial, sans-serif';
        ctx.fillText(card.value, x + 225, 555);
        if (card.value !== '—') {
          ctx.font = '700 25px Arial, sans-serif';
          ctx.fillText('/10', x + 225, 596);
        }
        ctx.fillStyle = '#6e7178';
        ctx.font = '400 17px Arial, sans-serif';
        ctx.fillText(card.note, x + 225, 644);
      });
      ctx.fillStyle = '#101114';
      ctx.font = '700 44px Arial, sans-serif';
      ctx.textAlign = 'left';
      drawWrappedText(ctx, finalSentence, 190, 790, 1220, 53, 3);
      reportRoundRect(ctx, 330, 925, 940, 70, 35, '#101114');
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 20px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Ressenti · Évaluation clinique · Repères de vie · Objectif', 800, 968);
      ctx.textAlign = 'left';
      return page.canvas;
    }

    function createJourneyReportPage() {
  ensureTrajectory(false);
  const page = makeReportPage(
    '4 - Parcours thérapeutique',
    'Votre progression, étape par étape',
    'La courbe principale montre la moyenne des six critères. Les mini-courbes détaillent les évolutions par domaine.',
    4
  );
  const ctx = page.ctx;
  const global = generalTrajectoryValues();
  const count = Math.max(1, state.quotes.length);
  const stageColors = Array.from({length: count + 1}, (_, index) => stageCategoryColor(index));

  function bounds(values, minRange) {
    let low = Math.min(...values), high = Math.max(...values);
    const range = high - low;
    const padding = range < 1 ? 1 : Math.max(.45, range * .16);
    low = Math.max(0, low - padding);
    high = Math.min(10, high + padding);
    if (high - low < minRange) {
      const mid = (low + high) / 2;
      low = Math.max(0, mid - minRange / 2);
      high = Math.min(10, mid + minRange / 2);
    }
    return {low, high};
  }

  function pastelize(hex, ratio) {
    const clean = String(hex || '#ffffff').replace('#','');
    if (clean.length !== 6) return '#f7f8fa';
    const r=parseInt(clean.slice(0,2),16), g=parseInt(clean.slice(2,4),16), b=parseInt(clean.slice(4,6),16);
    const mix = value => Math.round(255 - (255 - value) * ratio).toString(16).padStart(2,'0');
    return '#' + mix(r) + mix(g) + mix(b);
  }

  function drawLineChart(x, y, width, height, values, colors, lineColor, showStageText, segmentColors) {
    const scale = bounds(values, 2);
    const left = x + 42, right = x + width - 20, top = y + 20, bottom = y + height - 38;
    const plotW = right - left, plotH = bottom - top;
    const yy = value => top + (scale.high - value) / Math.max(.001, scale.high - scale.low) * plotH;
    const xx = index => left + index / Math.max(1, values.length - 1) * plotW;
    [scale.low, (scale.low + scale.high) / 2, scale.high].forEach(value => {
      const v = Math.round(value * 10) / 10;
      const py = yy(v);
      ctx.strokeStyle = '#e4e8ec'; ctx.lineWidth = .8;
      ctx.beginPath(); ctx.moveTo(left, py); ctx.lineTo(right, py); ctx.stroke();
      ctx.fillStyle = '#7a8792'; ctx.font = '400 12px Arial, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(String(v), left - 9, py + 4);
    });
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const points = values.map((value,index) => ({x:xx(index), y:yy(value)}));
    for (let index = 0; index < points.length - 1; index++) {
      const p0 = points[index - 1] || points[index];
      const p1 = points[index];
      const p2 = points[index + 1];
      const p3 = points[index + 2] || p2;
      ctx.strokeStyle = (segmentColors && segmentColors[index]) || lineColor;
      ctx.lineWidth = showStageText ? 4 : 2.4;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.bezierCurveTo(
        p1.x + (p2.x - p0.x) / 6,
        p1.y + (p2.y - p0.y) / 6,
        p2.x - (p3.x - p1.x) / 6,
        p2.y - (p3.y - p1.y) / 6,
        p2.x, p2.y
      );
      ctx.stroke();
    }
    values.forEach((value,index) => {
      const px=xx(index), py=yy(value);
      ctx.beginPath(); ctx.arc(px, py, showStageText ? 8 : 5.5, 0, Math.PI * 2);
      ctx.fillStyle = colors[index] || lineColor; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = showStageText ? 2.5 : 1.8; ctx.stroke();
      ctx.fillStyle = colors[index] || lineColor; ctx.font = showStageText ? '700 16px Arial, sans-serif' : '700 13px Arial, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(formatShortScore(value), px, Math.max(y + 15, py - (showStageText ? 14 : 10)));
      if (showStageText) {
        ctx.fillStyle = '#556572'; ctx.font = '600 13px Arial, sans-serif';
        ctx.fillText(index === 0 ? 'Aujourd’hui' : 'Étape ' + index, px, bottom + 23);
      }
    });
    ctx.textAlign = 'left';
  }

  reportRoundRect(ctx, 80, 318, 1440, 360, 22, '#f8fafc', '#e1e6ea');
  ctx.fillStyle = '#263d55'; ctx.font = '700 25px Arial, sans-serif';
  ctx.fillText('Évolution globale · moyenne des six critères', 110, 358);
  drawLineChart(105, 375, 1390, 275, global, stageColors, '#263d55', true, state.quotes.map((quote, index) => stageColors[index + 1]));

  const miniW = 455, miniH = 142;
  criteria.forEach((criterion, index) => {
    const col = index % 3, row = Math.floor(index / 3);
    const x = 80 + col * 490, y = 716 + row * 156;
    reportRoundRect(ctx, x, y, miniW, miniH, 16, pastelize(criterion.color, .10), '#e3e7ea');
    ctx.fillStyle = criterion.color; ctx.beginPath(); ctx.arc(x + 20, y + 25, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#31495e'; ctx.font = '700 16px Arial, sans-serif';
    ctx.fillText(criterion.name, x + 34, y + 30);
    drawLineChart(x + 10, y + 34, miniW - 20, 104, state.trajectory[criterion.id], stageColors, criterion.color, false, state.quotes.map((quote, segmentIndex) => stageColors[segmentIndex + 1]));
  });

  ctx.fillStyle = '#66727d'; ctx.font = '400 14px Arial, sans-serif'; ctx.textAlign = 'center';
  const finance = financialSchedule();
  state.quotes.forEach((quote, index) => {
    const x = 105 + ((index + 1) / count) * 1390;
    ctx.fillStyle = stageColors[index + 1]; ctx.font = '700 15px Arial, sans-serif';
    ctx.fillText(moneyLabel(quote.amount), x, 694);
    ctx.fillStyle = '#71808c'; ctx.font = '400 12px Arial, sans-serif';
    ctx.fillText(monthLabel(finance[index].month), x, 710);
  });
  ctx.textAlign = 'left';
  return page.canvas;
}

function textBytes(value) {
      const bytes = new Uint8Array(value.length);
      for (let index = 0; index < value.length; index++) bytes[index] = value.charCodeAt(index) & 255;
      return bytes;
    }

    function joinBytes(parts) {
      const length = parts.reduce((sum, part) => sum + part.length, 0);
      const output = new Uint8Array(length);
      let offset = 0;
      parts.forEach(part => {
        output.set(part, offset);
        offset += part.length;
      });
      return output;
    }

    function jpegBytesFromDataUrl(dataUrl) {
      const binary = atob(dataUrl.split(',')[1]);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }

    function assemblePdfFromJpegs(dataUrls, imageWidth, imageHeight) {
      const pageWidth = 842;
      const pageHeight = 595;
      const maxObject = 2 + dataUrls.length * 3;
      const objects = new Array(maxObject + 1);
      const pageIds = dataUrls.map((_, index) => 3 + index * 3);
      objects[1] = [textBytes('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n')];
      objects[2] = [textBytes('2 0 obj\n<< /Type /Pages /Count ' + dataUrls.length + ' /Kids [' + pageIds.map(id => id + ' 0 R').join(' ') + '] >>\nendobj\n')];
      dataUrls.forEach((dataUrl, index) => {
        const pageId = 3 + index * 3;
        const contentId = pageId + 1;
        const imageId = pageId + 2;
        const imageName = 'Im' + (index + 1);
        const content = textBytes('q\n' + pageWidth + ' 0 0 ' + pageHeight + ' 0 0 cm\n/' + imageName + ' Do\nQ\n');
        const jpeg = jpegBytesFromDataUrl(dataUrl);
        objects[pageId] = [textBytes(pageId + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageWidth + ' ' + pageHeight + '] /Resources << /ProcSet [/PDF /ImageC] /XObject << /' + imageName + ' ' + imageId + ' 0 R >> >> /Contents ' + contentId + ' 0 R >>\nendobj\n')];
        objects[contentId] = [
          textBytes(contentId + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n'),
          content,
          textBytes('endstream\nendobj\n')
        ];
        objects[imageId] = [
          textBytes(imageId + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + imageWidth + ' /Height ' + imageHeight + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n'),
          jpeg,
          textBytes('\nendstream\nendobj\n')
        ];
      });
      const header = new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]);
      const parts = [header];
      const offsets = new Array(maxObject + 1).fill(0);
      let byteLength = header.length;
      for (let id = 1; id <= maxObject; id++) {
        offsets[id] = byteLength;
        objects[id].forEach(part => {
          parts.push(part);
          byteLength += part.length;
        });
      }
      const xrefOffset = byteLength;
      let xref = 'xref\n0 ' + (maxObject + 1) + '\n0000000000 65535 f \n';
      for (let id = 1; id <= maxObject; id++) xref += String(offsets[id]).padStart(10, '0') + ' 00000 n \n';
      xref += 'trailer\n<< /Size ' + (maxObject + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF\n';
      parts.push(textBytes(xref));
      return joinBytes(parts);
    }

    async function generateReportPDF(event) {
      const button = event.currentTarget;
      const status = document.getElementById('reportStatus');
      button.disabled = true;
      button.textContent = 'Création en cours…';
      status.textContent = 'Préparation des cinq pages, dont la trajectoire thérapeutique.';
      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const pages = [
          createComparisonReportPage(),
          createPopulationReportPage(),
          createTreatmentReportPage(),
          createJourneyReportPage(),
          createSummaryReportPage()
        ];
        const images = pages.map(canvas => canvas.toDataURL('image/jpeg', .94));
        const pdf = assemblePdfFromJpegs(images, pages[0].width, pages[0].height);
        const blob = new Blob([pdf], {type: 'application/pdf'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const date = new Date().toISOString().slice(0, 10);
        link.href = url;
        link.download = 'rapport-sourireplus-' + date + '.pdf';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 15000);
        status.textContent = 'Rapport téléchargé : 5 pages.';
      } catch (error) {
        status.textContent = 'La création du rapport n’a pas abouti. Réessayez.';
      } finally {
        button.disabled = false;
        button.textContent = 'Générer le rapport PDF';
      }
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => state.phase === 'results' && renderChart(), 120);
    });

    function registerWebMCP() {
      const context = document.modelContext;
      if (!context || typeof context.registerTool !== 'function') return;
      const scoreSchema = { anyOf: [{type:'integer', minimum:0, maximum:10}, {type:'string', enum:['unknown']}] };
      const clinicianScoreSchema = { type:'integer', minimum:0, maximum:10 };
      const scoreProperties = Object.fromEntries(criteria.map(c => [c.id, scoreSchema]));
      const clinicianProperties = Object.fromEntries(criteria.map(c => [c.id, clinicianScoreSchema]));
      const requiredIds = criteria.map(c => c.id);

      try {
        void Promise.resolve(context.registerTool({
          name: 'complete_smile_assessment',
          title: 'Compléter l’évaluation SourirePlus',
          description: 'Renseigne l’âge, les six ressentis du patient, l’évaluation clinique et les six objectifs après traitement, puis affiche les quatre lectures SourirePlus : ressenti, évaluation clinique, repères de vie et objectif.',
          inputSchema: {
            type: 'object',
            properties: {
              age: {type:'integer', minimum:10, maximum:100},
              patient: {type:'object', properties:scoreProperties, required:requiredIds, additionalProperties:false},
              clinician: {type:'object', properties:clinicianProperties, required:requiredIds, additionalProperties:false},
              objective: {type:'object', properties:clinicianProperties, required:requiredIds, additionalProperties:false}
            },
            required: ['age', 'patient', 'clinician', 'objective'],
            additionalProperties: false
          },
          annotations: {readOnlyHint:false, untrustedContentHint:false},
          execute(input) {
            if (!input || !Number.isInteger(input.age) || input.age < 10 || input.age > 100) throw new Error('Âge invalide.');
            for (const c of criteria) {
              const p = input.patient && input.patient[c.id];
              const d = input.clinician && input.clinician[c.id];
              const o = input.objective && input.objective[c.id];
              if (!(p === 'unknown' || (Number.isInteger(p) && p >= 0 && p <= 10))) throw new Error(`Ressenti invalide pour ${c.id}.`);
              if (!(Number.isInteger(d) && d >= 0 && d <= 10)) throw new Error(`Note clinique invalide pour ${c.id}.`);
              if (!(Number.isInteger(o) && o >= 0 && o <= 10)) throw new Error(`Objectif invalide pour ${c.id}.`);
            }
            state.age = input.age;
            state.patient = {...input.patient};
            state.clinician = {...input.clinician};
            state.objective = {...input.objective};
            state.phase = 'results';
            state.resultView = 'comparison';
            state.filter = 'treatment';
            render();
            const numericPatient = criteria.map(c => state.patient[c.id]).filter(Number.isFinite);
            return {
              status:'visuals_ready',
              age:state.age,
              patient_average:numericPatient.length ? average(numericPatient) : null,
              clinical_average:average(criteria.map(c => state.clinician[c.id])),
              objective_average:average(criteria.map(c => state.objective[c.id])),
              unknown_count:criteria.filter(c => state.patient[c.id] === 'unknown').length
            };
          }
        })).catch(() => {});
      } catch (_) {}
    }

    render();
    registerWebMCP();
  </script>
