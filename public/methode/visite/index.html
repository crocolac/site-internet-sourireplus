<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="La Méthode SourirePlus relie votre ressenti, l’évaluation clinique, les repères de vie et l’objectif du traitement.">
  <meta name="robots" content="noindex,nofollow">
  <title>La Méthode SourirePlus — Visite patient</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101114'/%3E%3Cpath d='M18 24c4-8 24-8 28 0M18 39c7 8 21 8 28 0' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23e51a78'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #101114;
      --muted: #686b73;
      --line: #dedfe3;
      --soft: #f4f5f7;
      --paper: #ffffff;
      --blue: #1473e6;
      --red: #e3262e;
      --green: #2ca640;
      --orange: #f5820b;
      --violet: #7137b9;
      --pink: #e51a78;
      --patient: #256fa8;
      --clinical: #101114;
      --objective: #078878;
      --accent: var(--blue);
      --shadow: 0 24px 70px rgba(16, 17, 20, .10);
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 10%, rgba(20, 115, 230, .08), transparent 28rem),
        radial-gradient(circle at 88% 90%, rgba(229, 26, 120, .07), transparent 30rem),
        #f7f7f8;
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(100% - 28px, 1180px);
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: .13em;
      font-size: .78rem;
      font-weight: 750;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    .top-note {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      font-size: .86rem;
      font-weight: 720;
      letter-spacing: .01em;
    }

    .rainbow {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      width: 100%;
      height: 5px;
      margin-bottom: 18px;
    }

    .rainbow span { border-radius: 999px; opacity: .22; transition: opacity .2s, transform .2s; }
    .rainbow span.active { opacity: 1; transform: scaleY(1.6); }

    .surface {
      overflow: hidden;
      border: 1px solid rgba(16, 17, 20, .09);
      border-radius: 28px;
      background: rgba(255, 255, 255, .96);
      box-shadow: var(--shadow);
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(310px, .85fr);
      min-height: 620px;
    }

    .intro-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(34px, 6vw, 78px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }
    h1 {
      max-width: 800px;
      margin-bottom: 20px;
      font-size: clamp(2.55rem, 7vw, 5.5rem);
      line-height: .94;
      letter-spacing: -.055em;
      font-weight: 680;
    }

    h2 {
      margin-bottom: 12px;
      font-size: clamp(2rem, 4.4vw, 4rem);
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 680;
    }

    .lead {
      max-width: 650px;
      margin-bottom: 30px;
      color: #44474e;
      font-size: clamp(1.05rem, 2vw, 1.24rem);
    }

    .intro-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100%;
      padding: clamp(28px, 5vw, 56px);
      color: white;
      background: var(--ink);
    }

    .orbit {
      position: relative;
      width: min(100%, 330px);
      aspect-ratio: 1;
      margin: 0 auto 34px;
    }

    .orbit::before, .orbit::after {
      content: "";
      position: absolute;
      inset: 15%;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
    }
    .orbit::after { inset: 31%; }

    .orbit-dot {
      --angle: 0deg;
      position: absolute;
      top: 50%; left: 50%;
      width: 46px; height: 46px;
      margin: -23px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--c);
      color: white;
      font-size: 1.25rem;
      font-weight: 800;
      transform: rotate(var(--angle)) translateX(128px) rotate(calc(-1 * var(--angle)));
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }

    .orbit-center {
      position: absolute;
      inset: 38%;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: white;
      color: var(--ink);
      font-size: 1.35rem;
      font-weight: 800;
    }

    .field { display: grid; gap: 8px; margin-top: 14px; }
    .field label { color: rgba(255,255,255,.76); font-size: .92rem; }
    .age-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .age-input {
      min-width: 0;
      height: 54px;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,.09);
      color: white;
      font-size: 1.06rem;
    }
    .age-input:focus { border-color: white; box-shadow: 0 0 0 3px rgba(255,255,255,.14); }

    .btn {
      min-height: 52px;
      padding: 0 22px;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 720;
      transition: transform .16s, background .16s, border-color .16s, opacity .16s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 3px solid rgba(20,115,230,.28); outline-offset: 3px; }
    .btn:disabled { cursor: not-allowed; opacity: .38; transform: none; }
    .btn-primary { background: var(--ink); color: white; }
    .intro-panel .btn-primary { background: white; color: var(--ink); }
    .btn-secondary { border-color: var(--line); background: white; color: var(--ink); }
    .btn-secondary.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, white); color: var(--accent); }
    .btn-ghost { min-height: 44px; padding: 0 14px; background: transparent; color: var(--muted); }

    .fineprint { margin: 16px 0 0; color: rgba(255,255,255,.58); font-size: .84rem; }

    .question {
      display: grid;
      grid-template-columns: minmax(250px, .72fr) minmax(0, 1.28fr);
      min-height: 620px;
    }

    .question-visual {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 5vw, 56px);
      color: white;
      background: var(--accent);
    }

    .question-visual::after {
      content: "";
      position: absolute;
      width: 420px; height: 420px;
      right: -180px; bottom: -180px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      box-shadow: 0 0 0 42px rgba(255,255,255,.04), 0 0 0 88px rgba(255,255,255,.035);
    }

    .step-label { font-size: .82rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
    .big-icon {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 148px; height: 148px;
      margin: auto;
      border: 1px solid rgba(255,255,255,.36);
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      font-size: 4.3rem;
      line-height: 1;
      backdrop-filter: blur(8px);
    }

    .visual-name { position: relative; z-index: 1; margin: 0; font-size: clamp(1.5rem, 3vw, 2.6rem); letter-spacing: -.035em; }

    .question-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(32px, 6vw, 78px);
    }

    .question-copy h2 { max-width: 760px; }
    .detail { max-width: 700px; margin-bottom: 34px; color: var(--muted); font-size: 1.04rem; }

    .score-card {
      padding: clamp(22px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--soft);
    }

    .score-head { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .score-title { margin: 0; color: var(--muted); font-size: .9rem; font-weight: 720; letter-spacing: .05em; text-transform: uppercase; }
    .score-value { min-width: 90px; color: var(--accent); text-align: right; font-size: clamp(2.4rem, 6vw, 4.4rem); line-height: .8; font-weight: 760; letter-spacing: -.06em; }
    .score-value small { font-size: .32em; letter-spacing: 0; }

    .range {
      width: 100%;
      height: 34px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .range:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 25%, transparent); outline-offset: 5px; }
    .range-labels { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font-size: .84rem; }
    .range-labels span:last-child { text-align: right; }

    .question-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .question-actions .right { display: flex; gap: 10px; }

    .handoff {
      min-height: 620px;
      display: grid;
      place-items: center;
      padding: clamp(36px, 8vw, 90px);
      text-align: center;
    }
    .handoff-inner { max-width: 720px; }
    .checkmark {
      width: 84px; height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      font-size: 2rem;
    }
    .handoff h1 { font-size: clamp(2.7rem, 7vw, 5rem); }
    .handoff .lead { margin-inline: auto; }
    .privacy-pill { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 26px; padding: 8px 13px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: .86rem; }

    .results { padding: clamp(24px, 5vw, 56px); }
    .results-head { display: flex; align-items: end; justify-content: space-between; gap: 28px; margin-bottom: 26px; }
    .results-head h1 { margin-bottom: 10px; font-size: clamp(2.6rem, 6vw, 5.2rem); }
    .results-head .lead { margin-bottom: 0; }
    .results-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin: 18px 0;
      color: var(--muted);
      font-size: .88rem;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 8px; }
    .legend-shape { width: 13px; height: 13px; display: inline-block; border: 2px solid var(--ink); background: white; }
    .legend-shape.patient { border-radius: 50%; }
    .legend-shape.clinician { background: var(--ink); transform: rotate(45deg) scale(.78); }
    .legend-shape.objective { border-color: var(--objective); border-radius: 50%; background: var(--objective); }
    .legend-line { width: 26px; border-top: 3px solid #999; opacity: .48; }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 1px 12px;
      scrollbar-width: thin;
    }
    .filter {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--muted);
      cursor: pointer;
      font-size: .88rem;
      font-weight: 700;
    }
    .filter.active { border-color: var(--ink); background: var(--ink); color: white; }

    .chart-card {
      overflow: hidden;
      padding: 18px 12px 8px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: white;
    }
    .chart-titles { display: flex; justify-content: space-between; gap: 16px; padding: 0 12px 6px; color: var(--muted); font-size: .76rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    #chart { display: block; width: 100%; height: 460px; }
    .chart-note { margin: 10px 12px 8px; color: var(--muted); font-size: .82rem; }

    .population-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.38fr) minmax(300px, .62fr);
      gap: 18px;
      align-items: start;
    }

    .population-story {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--ink);
      color: white;
    }

    .population-story h3 { margin: 0 0 7px; font-size: 1.15rem; }
    .population-story > p { margin: 0 0 18px; color: #c9cbd1; font-size: .9rem; }
    .population-facts { display: grid; gap: 10px; }
    .population-fact {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 13px;
      align-items: start;
      padding: 13px;
      border-radius: 15px;
      background: rgba(255,255,255,.08);
    }
    .fact-value {
      color: var(--c);
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.04em;
    }
    .fact-value small { font-size: .55em; letter-spacing: 0; }
    .fact-copy { margin: 0; color: #ececef; font-size: .86rem; line-height: 1.42; }
    .fact-copy strong { color: white; }
    .population-key {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      padding: 12px 13px;
      border-radius: 14px;
      background: #f2f3f5;
      color: #555861;
      font-size: .84rem;
    }
    .population-key strong { color: var(--ink); }

    .summary-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; margin-top: 18px; }
    .panel { padding: 22px; border: 1px solid var(--line); border-radius: 22px; background: white; }
    .panel h3 { margin: 0 0 16px; font-size: 1.05rem; }
    .score-list { display: grid; gap: 8px; }
    .score-row {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) 110px 120px 92px;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 7px 10px;
      border-radius: 13px;
      background: var(--soft);
    }
    .criterion-label { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 720; }
    .color-dot { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; background: var(--c); }
    .value-pill { white-space: nowrap; color: var(--muted); font-size: .9rem; }
    .value-pill strong { color: var(--ink); font-size: 1.05rem; }
    .gap { justify-self: end; white-space: nowrap; color: var(--muted); font-size: .83rem; }
    .gap.large { color: #9b3f00; font-weight: 760; }

    .discussion { display: grid; gap: 13px; }
    .discussion-item { padding: 14px 15px; border-left: 4px solid var(--c, var(--ink)); border-radius: 8px 13px 13px 8px; background: var(--soft); }
    .discussion-item strong { display: block; margin-bottom: 3px; }
    .discussion-item span { color: var(--muted); font-size: .9rem; }
    .empty-discussion { color: var(--muted); }

    .scale-warning {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      padding: 15px 17px;
      border-radius: 16px;
      background: #f2f3f5;
      color: #555861;
      font-size: .88rem;
    }
    .scale-warning strong { color: var(--ink); }

    .result-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 28px;
    }

    .result-tab {
      min-height: 54px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      color: var(--muted);
      cursor: pointer;
      font-weight: 720;
    }

    .result-tab.active {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }

    .result-stage { min-height: 510px; }

    .stage-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 22px;
    }

    .stage-head h2 { margin-bottom: 8px; font-size: clamp(2rem, 4vw, 3.5rem); }
    .stage-head p { max-width: 720px; margin-bottom: 0; color: var(--muted); font-size: 1.02rem; }
    .stage-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

    .method-signature {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      color: var(--ink);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .method-signature::before {
      content: "S+";
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      letter-spacing: 0;
    }

    .visual-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(260px, .55fr);
      gap: 18px;
      align-items: start;
    }

    .comparison-list {
      display: grid;
      gap: 8px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: white;
    }

    .comparison-row {
      display: grid;
      grid-template-columns: minmax(145px, .7fr) minmax(180px, 1.3fr) 148px;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 8px 10px;
      border-radius: 14px;
      background: var(--soft);
    }

    .score-track {
      position: relative;
      height: 32px;
      margin: 0 10px;
    }

    .score-track::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 15px;
      height: 3px;
      border-radius: 999px;
      background: #d9dbe0;
    }

    .score-track::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 10px;
      width: 1px;
      height: 13px;
      background: #b9bbc1;
    }

    .track-marker {
      position: absolute;
      left: calc(var(--score) * 10%);
      z-index: 1;
      width: 14px;
      height: 14px;
      transform: translateX(-50%);
    }

    .track-marker.patient {
      top: 2px;
      border: 3px solid var(--patient);
      border-radius: 50%;
      background: white;
    }

    .track-marker.clinical {
      bottom: 1px;
      background: var(--clinical);
      transform: translateX(-50%) rotate(45deg) scale(.8);
    }

    .track-marker.objective {
      bottom: 1px;
      border-radius: 50%;
      background: var(--objective);
      box-shadow: 0 0 0 2px white;
    }

    .comparison-values {
      color: var(--muted);
      font-size: .88rem;
      text-align: right;
      white-space: nowrap;
    }

    .comparison-values strong { color: var(--ink); }

    .life-strip {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 18px;
    }

    .life-stage {
      min-height: 64px;
      padding: 10px 8px;
      border-radius: 13px;
      background: var(--soft);
      color: var(--muted);
      text-align: center;
    }

    .life-stage strong { display: block; color: inherit; }
    .life-stage span { font-size: .78rem; }
    .life-stage.active { background: var(--ink); color: white; }

    .impact-line {
      position: absolute;
      left: calc(var(--from) * 10%);
      top: 14px;
      width: calc((var(--to) - var(--from)) * 10%);
      height: 5px;
      border-radius: 999px;
      background: var(--objective);
      opacity: .42;
    }

    .effect-list { display: grid; gap: 12px; }
    .effect-item {
      padding: 14px 15px;
      border-left: 4px solid var(--c);
      border-radius: 8px 13px 13px 8px;
      background: var(--soft);
    }
    .effect-item strong { display: block; }
    .effect-item span { color: var(--muted); font-size: .9rem; }

    .triple-score {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 28px 0;
    }

    .global-score {
      display: grid;
      align-content: center;
      min-height: 210px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: white;
      text-align: center;
    }

    .global-score.objective { border-color: color-mix(in srgb, var(--objective) 45%, white); background: color-mix(in srgb, var(--objective) 7%, white); }
    .global-label { margin-bottom: 8px; color: var(--muted); font-weight: 720; }
    .global-value { margin-bottom: 7px; color: var(--ink); font-size: clamp(3.3rem, 8vw, 6.4rem); line-height: .85; font-weight: 760; letter-spacing: -.07em; }
    .global-score.patient .global-value { color: var(--patient); }
    .global-score.clinical .global-value { color: var(--clinical); }
    .global-score.objective .global-value { color: var(--objective); }
    .global-value small { font-size: .24em; letter-spacing: 0; }
    .global-note { margin: 0; color: var(--muted); font-size: .82rem; }

    .final-message {
      max-width: 850px;
      margin: 10px auto 0;
      text-align: center;
    }

    .final-message h2 { margin-bottom: 14px; }
    .final-message p { color: var(--muted); font-size: 1rem; }

    .report-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: 22px;
      padding: 24px;
      border-radius: 22px;
      background: var(--ink);
      color: white;
    }
    .report-actions h3 { margin: 0 0 5px; font-size: 1.15rem; }
    .report-actions p { margin: 0; color: #c9cbd1; font-size: .9rem; }
    .report-actions .btn { flex: 0 0 auto; border-color: white; background: white; color: var(--ink); }
    .report-actions .btn:hover { background: #f0f1f3; }
    .report-actions .btn:disabled { opacity: .65; cursor: wait; }
    .report-status { min-height: 1.3em; margin-top: 7px !important; color: white !important; }

    .view-next {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (max-width: 820px) {
      .intro, .question { grid-template-columns: 1fr; }
      .intro { min-height: 0; }
      .intro-copy { padding-bottom: 40px; }
      .intro-panel { min-height: 460px; }
      .orbit { width: 260px; }
      .orbit-dot { transform: rotate(var(--angle)) translateX(100px) rotate(calc(-1 * var(--angle))); }
      .question { min-height: 0; }
      .question-visual { min-height: 250px; }
      .big-icon { width: 104px; height: 104px; font-size: 3rem; }
      .question-copy { padding-top: 36px; }
      .summary-grid { grid-template-columns: 1fr; }
      .visual-grid { grid-template-columns: 1fr; }
      .population-grid { grid-template-columns: 1fr; }
      .results-head { align-items: flex-start; flex-direction: column; }
      .results-actions { justify-content: flex-start; }
      .score-row { grid-template-columns: minmax(120px, 1fr) 92px 102px; }
      .gap { grid-column: 2 / 4; justify-self: start; }
      .comparison-row { grid-template-columns: minmax(130px, .8fr) minmax(170px, 1.2fr); }
      .comparison-values { grid-column: 2; text-align: left; }
      .triple-score { grid-template-columns: 1fr; }
      .global-score { min-height: 170px; }
    }

    @media (max-width: 540px) {
      .shell { width: min(100% - 18px, 1180px); padding-top: 14px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 9px; }
      .top-note { display: block; width: 100%; border-radius: 14px; line-height: 1.4; }
      .surface { border-radius: 20px; }
      .intro-copy, .intro-panel, .question-copy, .question-visual, .results { padding: 26px 20px; }
      .intro-panel { min-height: 430px; }
      .age-row { grid-template-columns: 1fr; }
      .question-visual { min-height: 220px; }
      .question-actions { align-items: stretch; flex-direction: column-reverse; }
      .question-actions .right { display: grid; grid-template-columns: 1fr 1fr; }
      .question-actions .btn-ghost { align-self: flex-start; }
      .score-card { padding: 20px 16px; }
      .range-labels { font-size: .78rem; }
      .handoff { min-height: 560px; }
      #chart { height: 390px; }
      .chart-titles { font-size: .68rem; }
      .score-row { grid-template-columns: 1fr 1fr; padding: 12px; }
      .criterion-label { grid-column: 1 / 3; }
      .gap { grid-column: 1 / 3; }
      .result-tabs { grid-template-columns: 1fr 1fr; }
      .stage-head { align-items: flex-start; flex-direction: column; }
      .stage-actions { justify-content: flex-start; }
      .comparison-list { padding: 10px; }
      .comparison-row { grid-template-columns: 1fr; gap: 5px; padding: 12px; }
      .comparison-values { grid-column: 1; text-align: left; }
      .life-strip { grid-template-columns: 1fr; }
      .life-stage { min-height: 0; display: flex; align-items: center; justify-content: space-between; text-align: left; }
      .report-actions { align-items: stretch; flex-direction: column; }
      .report-actions .btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    @media print {
      body { background: white; }
      .shell { width: 100%; padding: 0; }
      .topbar, .rainbow, .results-actions, .filter-row, .report-actions { display: none !important; }
      .surface, .panel, .chart-card { box-shadow: none; border-color: #bbb; }
      .results { padding: 18px; }
      .results-head h1 { font-size: 2.6rem; }
      #chart { height: 390px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#" id="brandLink" aria-label="Revenir au début">
        <span class="brand-mark">S+</span>
        <span>La Méthode SourirePlus</span>
      </a>
      <span class="top-note">Ressenti · Évaluation clinique · Repères de vie · Objectif</span>
    </header>
    <div class="rainbow" id="rainbow" aria-hidden="true"></div>
    <main class="surface" id="app" aria-live="polite"></main>
  </div>

  <script>
    const criteria = [
      {
        id: 'alignement', name: 'Alignement', color: '#1473e6', icon: '↔',
        action: 'l’alignement de vos dents',
        prompt: 'Comment jugez-vous l’alignement de vos dents aujourd’hui ?',
        detail: 'Pensez aux espaces, aux chevauchements ou aux dents qui ont bougé.',
        clinical: 'Position des dents, stabilité et migrations.'
      },
      {
        id: 'caries', name: 'Caries', color: '#e3262e', icon: '◇',
        action: 'la protection de vos dents contre les caries',
        prompt: 'À votre connaissance, vos dents sont-elles bien protégées des caries ?',
        detail: 'Répondez avec ce que vous savez ou ressentez. « Je ne sais pas » est aussi une réponse utile.',
        clinical: 'Caries actives, risque, récidives et racines.'
      },
      {
        id: 'gencives', name: 'Gencives', color: '#2ca640', icon: '≈',
        action: 'la santé de vos gencives',
        prompt: 'Comment ressentez-vous la santé de vos gencives ?',
        detail: 'Pensez aux saignements, à la sensibilité, au déchaussement ou à l’inconfort.',
        clinical: 'Santé des gencives, attache, os et implants.'
      },
      {
        id: 'restaurations', name: 'Restaurations', color: '#f5820b', icon: '▣',
        action: 'la qualité de vos restaurations',
        prompt: 'Dans quel état vous semblent vos dents déjà soignées ?',
        detail: 'Cela concerne notamment les composites, couronnes, bridges et implants.',
        clinical: 'Entretien, réparation, remplacement et réhabilitation.'
      },
      {
        id: 'fonction', name: 'Fonction & confort', color: '#7137b9', icon: '⌁',
        action: 'la fonction et le confort de votre bouche',
        prompt: 'Votre bouche vous paraît-elle confortable et efficace au quotidien ?',
        detail: 'Pensez à la mastication, au serrage, à l’usure, aux douleurs et aux gênes.',
        clinical: 'Occlusion, mastication, usure, bruxisme, douleurs et confort.'
      },
      {
        id: 'esthetique', name: 'Esthétique', color: '#e51a78', icon: '✦',
        action: 'l’esthétique de votre sourire',
        prompt: 'Êtes-vous satisfait de l’esthétique de votre sourire ?',
        detail: 'Pensez à la couleur, à la forme et à l’harmonie générale.',
        clinical: 'Couleur, forme et harmonie du sourire.'
      }
    ];

    const referenceSeries = [
      { id:'alignement', points:[[10,30],[15,50],[20,25],[30,5],[41,11],[50,25],[60,35],[65,40],[70,48],[80,60]] },
      { id:'caries', points:[[10,35],[15,30],[20,15],[29,11],[39,41],[50,23],[60,26],[66,30],[73,39],[80,76]] },
      { id:'gencives', points:[[10,5],[15,8],[22,11],[29,25],[38,18],[50,32],[60,59],[66,68],[74,76],[80,82]] },
      { id:'restaurations', points:[[10,2],[15,5],[22,8],[32,11],[40,32],[48,28],[56,51],[62,67],[70,80],[80,88]] },
      { id:'fonction', points:[[10,25],[15,48],[20,30],[30,12],[40,18],[50,30],[60,35],[65,40],[70,62],[80,82]] },
      { id:'esthetique', points:[[10,10],[15,35],[20,52],[30,45],[38,25],[50,65],[60,65],[68,59],[75,48],[80,19]] }
    ];

    const state = {
      phase: 'intro',
      role: 'patient',
      index: 0,
      age: null,
      answer: null,
      patient: {},
      clinician: {},
      objective: {},
      resultView: 'comparison',
      filter: 'treatment'
    };

    const app = document.getElementById('app');
    const rainbow = document.getElementById('rainbow');
    const colorById = Object.fromEntries(criteria.map(c => [c.id, c.color]));

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function setRainbow(activeIndex = -1) {
      rainbow.innerHTML = criteria.map((c, i) => `<span class="${i === activeIndex ? 'active' : ''}" style="background:${c.color}"></span>`).join('');
    }

    function resetAll() {
      state.phase = 'intro';
      state.role = 'patient';
      state.index = 0;
      state.age = null;
      state.answer = null;
      state.patient = {};
      state.clinician = {};
      state.objective = {};
      state.resultView = 'comparison';
      state.filter = 'treatment';
      render();
    }

    document.getElementById('brandLink').addEventListener('click', (event) => {
      event.preventDefault();
      if (state.phase === 'intro' || confirm('Revenir au début et effacer les réponses de cette session ?')) resetAll();
    });

    function render() {
      window.scrollTo({top: 0, behavior: 'smooth'});
      if (state.phase === 'intro') renderIntro();
      else if (state.phase === 'question') renderQuestion();
      else if (state.phase === 'handoff') renderHandoff();
      else if (state.phase === 'projection') renderProjectionHandoff();
      else renderResults();
    }

    function renderIntro() {
      setRainbow();
      app.innerHTML = `
        <section class="intro">
          <div class="intro-copy">
            <p class="eyebrow">Votre parcours en quatre temps · environ 2 minutes</p>
            <h1>Commençons par votre ressenti.</h1>
            <p class="lead">Avant le scan, les radios et l’examen, nous souhaitons savoir comment vous percevez votre bouche aujourd’hui. Il n’y a ni bonne ni mauvaise réponse.</p>
            <p style="color:var(--muted);margin:0"><strong>Pour chaque critère, 0 décrit une situation très mauvaise et 10 une situation excellente.</strong> Si vous hésitez, choisissez « Je ne sais pas ».</p>
          </div>
          <div class="intro-panel">
            <div class="orbit" aria-hidden="true">
              ${criteria.map((c,i) => `<span class="orbit-dot" style="--angle:${i*60}deg;--c:${c.color}">${c.icon}</span>`).join('')}
              <span class="orbit-center">6</span>
            </div>
            <form id="startForm" class="field">
              <label for="age">Votre âge</label>
              <div class="age-row">
                <input class="age-input" id="age" name="age" type="number" inputmode="numeric" min="10" max="100" placeholder="Ex. 52" autocomplete="off" required>
                <button class="btn btn-primary" type="submit">Commencer</button>
              </div>
              <p class="fineprint">Votre âge permettra ensuite de situer la solution proposée dans les repères SourirePlus. Vos réponses ouvrent le dialogue ; seul l’examen établit le constat clinique.</p>
            </form>
          </div>
        </section>`;
      document.getElementById('startForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const age = Number(document.getElementById('age').value);
        if (!Number.isFinite(age) || age < 10 || age > 100) {
          document.getElementById('age').setCustomValidity('Indiquez un âge entre 10 et 100 ans.');
          document.getElementById('age').reportValidity();
          return;
        }
        state.age = age;
        state.phase = 'question';
        state.role = 'patient';
        state.index = 0;
        state.answer = null;
        render();
      });
      document.getElementById('age').addEventListener('input', event => event.target.setCustomValidity(''));
    }

    function renderQuestion() {
      const c = criteria[state.index];
      const isPatient = state.role === 'patient';
      const isClinical = state.role === 'clinician';
      const isObjective = state.role === 'objective';
      const store = isPatient ? state.patient : (isClinical ? state.clinician : state.objective);
      const existing = Object.prototype.hasOwnProperty.call(store, c.id) ? store[c.id] : null;
      state.answer = existing !== null ? existing : (isObjective ? state.clinician[c.id] : null);
      const stepName = isPatient ? 'Votre ressenti' : (isClinical ? 'Évaluation clinique' : 'Objectif du traitement');
      const eyebrow = isPatient ? 'Votre perception aujourd’hui' : (isClinical ? 'Constat du praticien' : 'Effet attendu de la solution');
      const question = isPatient
        ? c.prompt
        : (isClinical ? 'Quelle note décrit le mieux la situation clinique actuelle ?' : 'Quelle note paraît atteignable après le traitement proposé ?');
      const detail = isPatient
        ? c.detail
        : (isClinical ? c.clinical : `${c.clinical} Situation actuelle : ${state.clinician[c.id]}/10.`);
      const scoreTitle = isPatient ? 'Votre note' : (isClinical ? 'Note clinique' : 'Note estimée après traitement');
      const lastLabel = isPatient ? 'Valider mon ressenti' : (isClinical ? 'Passer à l’objectif' : 'Voir la restitution');
      document.documentElement.style.setProperty('--accent', c.color);
      setRainbow(state.index);

      app.innerHTML = `
        <section class="question" style="--accent:${c.color}">
          <div class="question-visual">
            <span class="step-label">${stepName} · ${state.index + 1} / 6</span>
            <div class="big-icon" aria-hidden="true">${c.icon}</div>
            <h3 class="visual-name">${c.name}</h3>
          </div>
          <div class="question-copy">
            <p class="eyebrow">${eyebrow}</p>
            <h2>${question}</h2>
            <p class="detail">${detail}</p>
            <div class="score-card">
              <div class="score-head">
                <p class="score-title">${scoreTitle}</p>
                <div class="score-value" id="scoreValue">${typeof state.answer === 'number' ? `${state.answer}<small>/10</small>` : (state.answer === 'unknown' ? '?' : '—')}</div>
              </div>
              <label class="sr-only" for="score">Note de 0 à 10</label>
              <input class="range" id="score" type="range" min="0" max="10" step="1" value="${typeof state.answer === 'number' ? state.answer : 5}" aria-describedby="scaleLabels">
              <div class="range-labels" id="scaleLabels">
                <span>0 · Situation très mauvaise</span>
                <span>10 · Situation excellente</span>
              </div>
            </div>
            <div class="question-actions">
              <button class="btn btn-ghost" id="backBtn" type="button" ${state.index === 0 ? 'disabled' : ''}>← Précédent</button>
              <div class="right">
                ${isPatient ? `<button class="btn btn-secondary ${state.answer === 'unknown' ? 'selected' : ''}" id="unknownBtn" type="button">Je ne sais pas</button>` : ''}
                <button class="btn btn-primary" id="nextBtn" type="button" ${state.answer === null ? 'disabled' : ''}>${state.index === 5 ? lastLabel : 'Continuer'}</button>
              </div>
            </div>
          </div>
        </section>`;

      const slider = document.getElementById('score');
      const scoreValue = document.getElementById('scoreValue');
      const nextBtn = document.getElementById('nextBtn');
      const unknownBtn = document.getElementById('unknownBtn');

      slider.addEventListener('input', () => {
        state.answer = Number(slider.value);
        scoreValue.innerHTML = `${state.answer}<small>/10</small>`;
        nextBtn.disabled = false;
        if (unknownBtn) unknownBtn.classList.remove('selected');
      });

      if (unknownBtn) {
        unknownBtn.addEventListener('click', () => {
          state.answer = 'unknown';
          scoreValue.textContent = '?';
          unknownBtn.classList.add('selected');
          nextBtn.disabled = false;
        });
      }

      document.getElementById('backBtn').addEventListener('click', () => {
        if (state.index > 0) {
          state.index -= 1;
          render();
        }
      });

      nextBtn.addEventListener('click', () => {
        if (state.answer === null) return;
        store[c.id] = state.answer;
        if (state.index < criteria.length - 1) {
          state.index += 1;
          state.answer = null;
          render();
        } else if (isPatient) {
          state.phase = 'handoff';
          render();
        } else if (isClinical) {
          state.phase = 'projection';
          render();
        } else {
          state.phase = 'results';
          state.filter = 'treatment';
          render();
        }
      });
    }

    function renderHandoff() {
      setRainbow();
      app.innerHTML = `
        <section class="handoff">
          <div class="handoff-inner">
            <div class="checkmark" aria-hidden="true">✓</div>
            <p class="eyebrow">Votre ressenti est terminé</p>
            <h1>Merci. Nous avons maintenant votre point de vue.</h1>
            <p class="lead">L’équipe réalise ensuite le scan 3D et les radios utiles. Le praticien analyse ces images, puis examine votre bouche avant de donner son évaluation.</p>
            <div class="privacy-pill">◉ Vos notes restent masquées jusqu’à la comparaison.</div><br>
            <button class="btn btn-primary" id="clinicianBtn" type="button">Passer à l’évaluation clinique</button>
          </div>
        </section>`;
      document.getElementById('clinicianBtn').addEventListener('click', () => {
        state.role = 'clinician';
        state.index = 0;
        state.answer = null;
        state.phase = 'question';
        render();
      });
    }

    function renderProjectionHandoff() {
      setRainbow();
      app.innerHTML = `
        <section class="handoff">
          <div class="handoff-inner">
            <div class="checkmark" aria-hidden="true">→</div>
            <p class="eyebrow">Après l’évaluation clinique</p>
            <h1>Évaluons maintenant l’effet du traitement.</h1>
            <p class="lead">Pour chacun des six critères, le praticien indique la note qu’il pense pouvoir atteindre avec la solution proposée.</p>
            <div class="privacy-pill">◉ Cet objectif est une estimation clinique, pas une garantie.</div><br>
            <button class="btn btn-primary" id="objectiveBtn" type="button">Définir l’objectif après traitement</button>
          </div>
        </section>`;
      document.getElementById('objectiveBtn').addEventListener('click', () => {
        state.role = 'objective';
        state.index = 0;
        state.answer = null;
        state.resultView = 'comparison';
        state.phase = 'question';
        render();
      });
    }

    function renderResults() {
      setRainbow();
      document.documentElement.style.setProperty('--accent', '#101114');
      app.innerHTML = `
        <section class="results">
          <div class="results-head">
            <div>
              <p class="method-signature">La Méthode SourirePlus</p>
              <h1>Quatre lectures pour<br>décider ensemble.</h1>
              <p class="lead">Nous comparons d’abord votre perception au constat clinique, puis nous situons la solution à votre âge et montrons le résultat attendu.</p>
            </div>
            <div class="results-actions">
              <button class="btn btn-secondary" id="printBtn" type="button">Imprimer</button>
              <button class="btn btn-primary" id="restartBtn" type="button">Nouvelle évaluation</button>
            </div>
          </div>

          <nav class="result-tabs" aria-label="Les quatre lectures SourirePlus">
            ${resultTab('comparison', '1 · Ressenti & clinique')}
            ${resultTab('population', '2 · Solution & âge')}
            ${resultTab('treatment', '3 · Avant & après')}
            ${resultTab('summary', '4 · Synthèse')}
          </nav>

          <div class="result-stage" id="resultStage" aria-live="polite"></div>
        </section>`;

      document.getElementById('printBtn').addEventListener('click', () => window.print());
      document.getElementById('restartBtn').addEventListener('click', () => {
        if (confirm('Effacer les réponses et commencer une nouvelle évaluation ?')) resetAll();
      });
      document.querySelectorAll('[data-result-view]').forEach(button => button.addEventListener('click', () => {
        state.resultView = button.dataset.resultView;
        renderResults();
      }));
      renderResultView();
    }

    function resultTab(view, label) {
      return `<button class="result-tab ${state.resultView === view ? 'active' : ''}" type="button" data-result-view="${view}" aria-pressed="${state.resultView === view}">${label}</button>`;
    }

    function renderResultView() {
      const stage = document.getElementById('resultStage');
      if (!stage) return;
      if (state.resultView === 'comparison') stage.innerHTML = comparisonView();
      else if (state.resultView === 'population') stage.innerHTML = populationView();
      else if (state.resultView === 'treatment') stage.innerHTML = treatmentView();
      else stage.innerHTML = summaryView();

      document.querySelectorAll('[data-next-view]').forEach(button => button.addEventListener('click', () => {
        state.resultView = button.dataset.nextView;
        renderResults();
      }));

      if (state.resultView === 'population') {
        document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
          state.filter = button.dataset.filter;
          document.querySelectorAll('[data-filter]').forEach(item => item.classList.toggle('active', item.dataset.filter === state.filter));
          renderChart();
        }));
        renderChart();
      }

      const editObjective = document.getElementById('editObjectiveBtn');
      if (editObjective) editObjective.addEventListener('click', () => {
        state.role = 'objective';
        state.index = 0;
        state.answer = null;
        state.phase = 'question';
        state.resultView = 'treatment';
        render();
      });

      const reportButton = document.getElementById('generateReportBtn');
      if (reportButton) reportButton.addEventListener('click', generateReportPDF);
    }

    function comparisonView() {
      return `
        <section>
          <div class="stage-head">
            <div>
              <p class="eyebrow">1 · Ressenti et évaluation clinique</p>
              <h2>Voyons où les deux regards se rejoignent ou diffèrent.</h2>
              <p>Un écart ne signifie pas que l’un des deux regards est faux. Il indique simplement ce que nous devons expliquer ou examiner ensemble.</p>
            </div>
            <div class="legend" aria-label="Légende de la comparaison">
              <span class="legend-item"><i class="legend-shape patient"></i> Ressenti patient</span>
              <span class="legend-item"><i class="legend-shape clinician"></i> Constat clinique</span>
            </div>
          </div>
          <div class="visual-grid">
            <div class="comparison-list">${criteria.map(comparisonRow).join('')}</div>
            <aside class="panel">
              <h3>Les points à discuter</h3>
              <div class="discussion">${discussionItems()}</div>
            </aside>
          </div>
          <div class="view-next"><button class="btn btn-primary" type="button" data-next-view="population">Situer la solution à votre âge →</button></div>
        </section>`;
    }

    function comparisonRow(c) {
      const patient = state.patient[c.id];
      const clinical = state.clinician[c.id];
      const patientMarker = typeof patient === 'number' ? `<i class="track-marker patient" style="--score:${patient}"></i>` : '';
      const patientLabel = patient === 'unknown' ? 'Je ne sais pas' : `${patient}/10`;
      return `<div class="comparison-row">
        <div class="criterion-label"><i class="color-dot" style="--c:${c.color}"></i>${c.name}</div>
        <div class="score-track" role="img" aria-label="${c.name} : ressenti ${patientLabel}, constat clinique ${clinical} sur 10">
          ${patientMarker}
          <i class="track-marker clinical" style="--score:${clinical}"></i>
        </div>
        <div class="comparison-values">Ressenti <strong>${patientLabel}</strong> · Clinique <strong>${clinical}/10</strong></div>
      </div>`;
    }

    function populationView() {
      const stages = [
        ['Mise en place', 'jusqu’à 20 ans'],
        ['Séduire', 'autour de 30 ans'],
        ['Préserver', 'autour de 40 ans'],
        ['Préparer', 'autour de 50 ans'],
        ['Profiter', 'à partir de 70 ans']
      ];
      const active = lifeStageIndex(state.age);
      return `
        <section>
          <div class="stage-head">
            <div>
              <p class="eyebrow">2 · Repères de vie</p>
              <h2>Cette solution est-elle fréquente à ${state.age} ans ?</h2>
              <p>Nous affichons d’abord les critères que le traitement prévoit de modifier. Chaque point indique la proportion de personnes concernées au même âge.</p>
            </div>
          </div>
          <div class="life-strip" aria-label="Les cinq périodes de la vie">
            ${stages.map((stage, index) => `<div class="life-stage ${index === active ? 'active' : ''}"><strong>${stage[0]}</strong><span>${stage[1]}</span></div>`).join('')}
          </div>
          <div class="filter-row" id="filterRow" aria-label="Choisir une trajectoire">

            <button class="filter ${state.filter === 'all' ? 'active' : ''}" data-filter="all">Les 6 trajectoires</button>
            ${criteria.map(c => `<button class="filter ${state.filter === c.id ? 'active' : ''}" data-filter="${c.id}"><i class="color-dot" style="--c:${c.color}"></i>${c.name}</button>`).join('')}
          </div>
          <div class="population-grid">
            <div>
              <div class="chart-card">

                <svg id="chart" role="img" aria-label="Proportion de population concernée par les critères liés à la solution selon l’âge"></svg>
                <p class="chart-note"><strong>Plus la courbe est haute, plus ce type de traitement concerne de personnes à cet âge.</strong> C’est un repère de discussion, jamais une obligation de traitement.</p>
              </div>
              <div class="population-key"><span aria-hidden="true">●</span><div><strong>Le point coloré marque le croisement exact entre votre âge et la courbe.</strong> Il indique une proportion de population, pas votre note personnelle.</div></div>

    function solutionCriteria() {
      return criteria.filter(c => state.objective[c.id] !== state.clinician[c.id]);
    }

    function populationFacts() {
      const changed = solutionCriteria();
      if (!changed.length) return '<p class="empty-discussion">Aucun critère n’a été modifié dans la projection. Ajustez l’objectif pour relier la solution aux courbes.</p>';
      return changed.map(c => {
        const series = referenceSeries.find(item => item.id === c.id);
        const value = interpolateSeries(series.points, state.age);
        if (value === null) return `<article class="population-fact" style="--c:${c.color}"><div class="fact-value">—</div><p class="fact-copy"><strong>${c.name}</strong> Le repère de population est disponible jusqu’à 80 ans.</p></article>`;
        const percentage = Math.round(value);
        return `<article class="population-fact" style="--c:${c.color}"><div class="fact-value">${percentage}<small>%</small></div><p class="fact-copy"><strong>${c.name}</strong> Environ ${percentage} % de la population est concernée par ce type de traitement à ${state.age} ans.</p></article>`;
      }).join('');
    }

    function lifeStageIndex(age) {
      if (age <= 20) return 0;
      if (age < 35) return 1;
      if (age < 45) return 2;
      if (age < 70) return 3;
      return 4;
    }

    function treatmentView() {
      return `
        <section>
          <div class="stage-head">
            <div>
              <p class="eyebrow">3 · Avant et après le traitement</p>
              <h2>Voici ce que la solution devrait améliorer.</h2>

            </div>
            <div class="stage-actions">
              <button class="btn btn-secondary" id="editObjectiveBtn" type="button">Modifier l’objectif</button>
            </div>
          </div>
          <div class="legend" aria-label="Légende de la projection">
            <span class="legend-item"><i class="legend-shape clinician"></i> Constat clinique</span>
